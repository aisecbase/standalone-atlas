baseURL: "https://dukebarman.github.io/"
locale: "ru-RU"
defaultContentLanguage: "ru"
title: "ATLAS на русском"
enableRobotsTXT: true
disableKinds:
  - taxonomy
  - term
markup:
  goldmark:
    renderer:
      unsafe: true
outputs:
  home:
    - HTML
    - RSS
params:
