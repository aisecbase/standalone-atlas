  - source: "Limiting the release of model architectures and checkpoints can reduce an adversary's ability to target those models."
    use: "Ограничение публикации архитектур моделей и контрольных точек может снизить способность злоумышленника нацеливаться на эти модели."
  - source: "Limiting the release of model artifacts can reduce an adversary's ability to create an accurate proxy model."
    use: "Ограничение публикации артефактов модели может снизить способность злоумышленника создать точную прокси-модель."
  - source: "Log AI agent tool invocations to detect malicious calls."
    use: "Логируйте вызовы инструментов ИИ-агента для обнаружения вредоносных вызовов."
