  - source: "Maintaining a detailed history of datasets can help identify use of poisoned datasets from public sources."
    use: "Ведение подробной истории наборов данных может помочь выявлять использование отравленных наборов данных из публичных источников."
  - source: "Maintaining dataset provenance can help identify adverse changes to the data."
    use: "Поддержание происхождения наборов данных может помочь выявлять вредоносные изменения данных."
  - source: "Memory hardening reduces persistent context poisoning by controlling what an agent may save as memory, preventing saved data from becoming higher-authority instructions, and enabling poisoned records to be identified, quarantined, and rolled back."
    use: "Усиление защиты памяти снижает риск устойчивого отравления контекста: оно определяет, какие данные агенту разрешено сохранять в памяти, не позволяет сохранённым данным превращаться в инструкции с более высоким приоритетом и обеспечивает возможность выявлять отравленные записи, помещать их в карантин и возвращать к предыдущему состоянию."
  - source: "Model alignment can help steer the model away from hallucinated content."
    use: "Выравнивание модели может помогать уводить модель от галлюцинированного контента."
  - source: "Model alignment can improve the parametric safety of a model by guiding it away from unsafe prompts and responses."
    use: "Выравнивание может повысить безопасность, заложенную в параметры модели, снижая её восприимчивость к небезопасным промптам и вероятность формирования небезопасных ответов."
  - source: "Model alignment can increase the security of models to self replicating prompt attacks."
    use: "Выравнивание модели может повысить защищенность моделей от атак с самореплицирующимися промптами."
  - source: "Model and agent tool registries scan uploaded artifacts for malicious content before listing."
    use: "Реестры моделей и инструментов ИИ-агентов сканируют загружаемые артефакты на наличие вредоносного содержимого перед добавлением в каталог."
  - source: "Model guidelines can instruct the model to refuse a response to unsafe inputs."
    use: "Инструкции для модели могут предписывать ей отказываться отвечать на небезопасные входные данные."
  - source: "Model registries scan uploaded models for unsafe serialization, embedded code, malware, and known vulnerabilities before listing."
    use: "Реестры моделей сканируют загружаемые модели на признаки небезопасной сериализации, встроенный код, вредоносное ПО и известные уязвимости перед добавлением в каталог."
  - source: "Model repositories evaluate submissions for backdoors, data leakage, adversarial influence, and unexpected behavior before listing."
    use: "Перед публикацией в каталоге репозитории моделей проверяют поступающие материалы на наличие бэкдоров, утечек данных, состязательного воздействия и неожиданного поведения."
  - source: "Monitor queries and query patterns to the target model, block access if suspicious queries are detected."
    use: "Отслеживайте запросы и паттерны запросов к целевой модели и блокируйте доступ при обнаружении подозрительных запросов."
  - source: "Not distributing the model in software to edge devices, can limit an adversary's ability to gain full access to the model."
    use: "Отказ от распространения модели в ПО для периферийных устройств может ограничить способность злоумышленника получить полный доступ к модели."
  - source: "Obfuscating model outputs can prevent adversaries from collecting sensitive information about the model outputs."
    use: "Обфускация выходных данных модели может помешать злоумышленникам собирать чувствительную информацию о выходных данных модели."
  - source: "Obfuscating model outputs can reduce an adversary's ability to produce an accurate proxy model."
    use: "Обфускация выходных данных модели может снизить способность злоумышленника создать точную прокси-модель."
  - source: "Obfuscating model outputs reduces an adversary's ability to create effective adversarial inputs."
    use: "Обфускация выходных данных модели снижает способность злоумышленника создавать эффективные состязательные входные данные."
  - source: "Obfuscating model outputs reduces an adversary's ability to generate effective adversarial data."
    use: "Обфускация выходных данных модели снижает способность злоумышленника генерировать эффективные состязательные данные."
  - source: "Obfuscating model outputs reduces an adversary's ability to verify the efficacy of an attack."
    use: "Обфускация выходных данных модели снижает способность злоумышленника проверять эффективность атаки."
  - source: "Obfuscating model outputs restricts an adversary's ability to create an accurate proxy model by querying a model and observing its outputs."
    use: "Обфускация выходных данных модели ограничивает способность злоумышленника создать точную прокси-модель, запрашивая модель и наблюдая ее выходные данные."
  - source: "Place controlled instructions in content or workflows where later user actions or system events activate them. Verify trigger authorization, context handling, action restrictions, and monitoring."
    use: "Размещайте контролируемые инструкции в содержимом или рабочих процессах, где впоследствии их активируют действия пользователей или системные события. Проверяйте разрешения на активацию триггеров, обработку контекста, ограничения на действия и мониторинг."
  - source: "Place controlled malicious instructions in external or retrieved content processed by the system. Improve content trust boundaries, retrieval controls, instruction isolation, and restrictions on resulting actions."
    use: "Размещайте контролируемые вредоносные инструкции во внешнем или извлечённом содержимом, которое обрабатывает система. Совершенствуйте границы доверия при обработке содержимого, средства контроля извлечения, изоляцию инструкций и ограничения на действия, выполняемые в результате."
  - source: "Place synthetic secrets or canary records in representative data sources and attempt extraction through prompts, retrieval, tools, and rendered output. Improve authorization boundaries, filtering, tenant isolation, and exfiltration detection."
    use: "Размещайте синтетические секреты или записи-канарейки в репрезентативных источниках данных и пытайтесь извлечь их через промпты, механизмы извлечения данных, инструменты и отображаемые выходные данные. Совершенствуйте разграничение полномочий, фильтрацию, изоляцию тенантов и обнаружение эксфильтрации."
  - source: "Preprocessing model inputs can prevent malicious data from going through the machine learning pipeline."
    use: "Предобработка входных данных модели может предотвратить прохождение вредоносных данных через пайплайн машинного обучения."
  - source: "Prevent an attacker from introducing adversarial data into the system."
    use: "Предотвращает внесение злоумышленником состязательных данных в систему."
  - source: "Prevent attackers from leveraging poisoned datasets to launch backdoor attacks against a model."
    use: "Не дает злоумышленникам использовать отравленные наборы данных для запуска бэкдор-атак против модели."
  - source: "Prevent execution of ML artifacts that are not properly signed."
    use: "Предотвращайте выполнение ML-артефактов, которые не подписаны должным образом."
  - source: "Probe model and application interfaces for disclosure of system instructions, policies, tool definitions, or hidden context. Remove embedded secrets and improve configuration isolation and output controls."
    use: "Тестируйте интерфейсы модели и приложения на возможность раскрытия системных инструкций, политик, определений инструментов или скрытого контекста. Удаляйте встроенные секреты и совершенствуйте изоляцию конфигурации и средства контроля выходных данных."
  - source: "Protect machine learning artifacts with encryption."
    use: "Защищайте артефакты машинного обучения с помощью шифрования."
  - source: "Published datasets can be a target for poisoning attacks."
    use: "Опубликованные наборы данных могут стать целью атак отравления."
  - source: "Record dataset sources and modification history so datasets falsely presented as trusted can be identified."
    use: "Фиксируйте источники наборов данных и историю их изменений, чтобы выявлять наборы данных, выдаваемые за доверенные."
  - source: "Remediating poisoned data can re-establish dataset integrity."
    use: "Устранение последствий отравленных данных может восстановить целостность набора данных."
  - source: "Require authenticated access to production AI endpoints and monitor queries to limit unauthenticated probing of exposed AI services."
    use: "Требуйте аутентификации для доступа к ИИ-эндпоинтам в продакшене и отслеживайте запросы, чтобы ограничить зондирование доступных извне ИИ-сервисов без аутентификации."
  - source: "Requiring user confirmation of AI agent tool invocations can prevent the automatic execution of tools by an adversary."
    use: "Требование подтверждения пользователем вызовов инструментов ИИ-агента может предотвратить автоматическое выполнение инструментов злоумышленником."
  - source: "Restrict access to stored prompt templates and configurations containing internal delimiters."
    use: "Ограничивайте доступ к хранящимся шаблонам промптов и конфигурациям, содержащим внутренние разделители."
  - source: "Restrict access to stored system instructions and tool definitions containing privileged keywords."
    use: "Ограничивайте доступ к хранящимся системным инструкциям и определениям инструментов, содержащим привилегированные ключевые слова."
  - source: "Restrict access to stored system prompts and prompt templates."
    use: "Ограничивайте доступ к хранящимся системным промптам и шаблонам промптов."
  - source: "Restrict access to stored system prompts, configuration files, and model metadata."
    use: "Ограничивайте доступ к хранящимся системным промптам, конфигурационным файлам и метаданным моделей."
  - source: "Restrict library loading by ML artifacts."
    use: "Ограничьте загрузку библиотек ML-артефактами."
  - source: "Restrict library loading so command and script interpreters cannot load untrusted libraries as an execution mechanism."
    use: "Ограничивайте загрузку библиотек так, чтобы интерпретаторы команд и скриптов не могли загружать недоверенные библиотеки для выполнения кода."
  - source: "Restrict library loading to block credential-dumping paths that inject or load malicious code into processes holding authentication material."
    use: "Ограничивайте загрузку библиотек, чтобы блокировать сценарии дампа учётных данных, при которых вредоносный код внедряется или загружается в процессы, содержащие аутентификационные данные."
  - source: "Restrict library loading to trusted locations and approved libraries so disguised malicious libraries cannot be loaded as legitimate dependencies."
    use: "Разрешайте загрузку только одобренных библиотек из доверенных расположений, чтобы вредоносные библиотеки, замаскированные под легитимные зависимости, не могли быть загружены."
  - source: "Restrict model registries and training data to approved identities so compromised accounts expose only explicitly authorized AI assets."
    use: "Предоставляйте доступ к реестрам моделей и обучающим данным только одобренным субъектам доступа, чтобы при компрометации учётной записи доступными оказывались лишь те ИИ-активы, доступ к которым для этой учётной записи был явно разрешён."
  - source: "Restrict release of technical information on ML-enabled products and organizational information on the teams supporting ML-enabled products."
    use: "Ограничьте публикацию технической информации о продуктах с поддержкой ML и организационной информации о командах, сопровождающих такие продукты."
  - source: "Restrict write access to model registries and AI artifact stores."
    use: "Ограничивайте права на запись в реестры моделей и хранилища ИИ-артефактов."
  - source: "Restricting binaries from loading external libraries can limit their ability to execute malicious code."
    use: "Запрет бинарным файлам загружать внешние библиотеки может ограничить их способность выполнять вредоносный код."
  - source: "Restricting packages from loading external libraries can limit their ability to execute malicious code."
    use: "Запрет пакетам загружать внешние библиотеки может ограничить их способность выполнять вредоносный код."
  - source: "Restricting the automatic tool use when untrusted data is present can prevent adversaries from invoking tools via prompt injections."
    use: "Ограничение автоматического использования инструментов при наличии недоверенных данных может помешать злоумышленникам вызывать инструменты через промпт-инъекции."
  - source: "Robust evaluation of an AI model can be used to detect privacy concerns, data leakage, and potential for revealing sensitive information."
    use: "Тщательная оценка ИИ-модели может использоваться для выявления рисков для конфиденциальности, утечек данных и возможности раскрытия чувствительной информации."
  - source: "Robust evaluation of an AI model can help increase confidence that the model has not been poisoned."
    use: "Тщательная оценка ИИ-модели может повысить уверенность в том, что модель не была отравлена."
  - source: "Seed controlled malicious or misleading content into representative ingestion sources. Improve source authorization, provenance, content validation, indexing controls, and retrieval-time filtering."
    use: "Размещайте контролируемое вредоносное или вводящее в заблуждение содержимое в репрезентативных источниках поступления данных. Совершенствуйте механизмы допуска источников, отслеживание происхождения данных, валидацию содержимого, средства контроля индексирования и фильтрацию при извлечении данных."
  - source: "Segment AI agent components so an exposed service does not reveal or provide reachability to additional internal components."
    use: "Сегментируйте компоненты ИИ-агента так, чтобы доступный извне сервис не раскрывал сведения о других внутренних компонентах и не открывал к ним сетевой доступ."
  - source: "Segmentation can prevent adversaries from utilizing tools in an agentic workflow to collect sensitive data from AI services."
    use: "Сегментация может помешать злоумышленникам использовать инструменты в агентном рабочем процессе для сбора чувствительных данных из ИИ-сервисов."
  - source: "Segmentation can prevent adversaries from utilizing tools in an agentic workflow to collect sensitive data from RAG databases."
    use: "Сегментация может помешать злоумышленникам использовать инструменты в агентном рабочем процессе для сбора чувствительных данных из баз данных RAG."
  - source: "Segmentation can prevent adversaries from utilizing tools in an agentic workflow to collect sensitive data."
    use: "Сегментация может помешать злоумышленникам использовать инструменты в агентном рабочем процессе для сбора чувствительных данных."
  - source: "Segmentation can prevent adversaries from utilizing tools in an agentic workflow to compromise sensitive data sources."
    use: "Сегментация может помешать злоумышленникам использовать инструменты в агентном рабочем процессе для компрометации источников чувствительных данных."
  - source: "Segmentation can prevent adversaries from utilizing tools in an agentic workflow to harvest credentials."
    use: "Сегментация может помешать злоумышленникам использовать инструменты в агентном рабочем процессе для сбора учетных данных."
  - source: "Segmentation can prevent adversaries from utilizing tools in an agentic workflow to perform unsafe actions that affect other components."
    use: "Сегментация может помешать злоумышленникам использовать инструменты в агентном рабочем процессе для выполнения небезопасных действий, влияющих на другие компоненты."
  - source: "Simulate functional model extraction through inference queries. Establish appropriate authentication, rate limits, output restrictions, anomaly detection, and extraction monitoring."
    use: "Эмулируйте извлечение функциональной копии модели с помощью запросов на инференс. Внедрите надлежащую аутентификацию, ограничения частоты запросов, ограничения на выходные данные, обнаружение аномалий и мониторинг попыток извлечения модели."
  - source: "Submit adversarial workloads and exercise dependency failures that could exhaust inference or supporting services. Apply quotas, concurrency limits, timeouts, resource isolation, and graceful degradation based on findings."
    use: "Направляйте на систему состязательные рабочие нагрузки и отрабатывайте сценарии отказов зависимостей, которые могут привести к исчерпанию ресурсов сервисов инференса или вспомогательных сервисов. По результатам применяйте квоты, ограничения числа одновременных операций, таймауты, изоляцию ресурсов и механизмы плавной деградации."
  - source: "Submit controlled malicious instructions directly through user-facing model and application interfaces. Improve instruction enforcement, input controls, authorization, and monitoring."
    use: "Отправляйте контролируемые вредоносные инструкции напрямую через доступные пользователям интерфейсы модели и приложения. Совершенствуйте механизмы, обеспечивающие соблюдение инструкций, а также контроль входных данных, авторизацию и мониторинг."
  - source: "Submit controlled requests designed to consume disproportionate inference resources. Verify input constraints, timeouts, workload limits, resource isolation, and cost monitoring."
    use: "В контролируемых условиях направляйте на систему запросы, специально подготовленные для потребления непропорционально большого объёма ресурсов при инференсе. Проверяйте ограничения на входные данные, таймауты, ограничения рабочей нагрузки, изоляцию ресурсов и мониторинг затрат."
  - source: |-
      Suggested approaches:
        - Restrict the number of results shown
