technique_uses:
  - source: "Access controls can limit API access and prevent cost harvesting."
    use: "Контроль доступа может ограничивать доступ к API и предотвращать искусственное увеличение затрат."
  - source: "Access controls can limit an adversary's ability to identify AI models, datasets, and other artifacts on a system."
    use: "Контроль доступа может ограничить способность злоумышленника выявлять ИИ-модели, наборы данных и другие артефакты в системе."
  - source: "Access controls can prevent exfiltration."
    use: "Контроль доступа может предотвращать эксфильтрацию."
  - source: "Access controls can prevent or limit the collection of AI artifacts on the victim system."
    use: "Контроль доступа может предотвращать или ограничивать сбор ИИ-артефактов в системе жертвы."
  - source: "Access controls can prevent tampering with AI artifacts and prevent unauthorized modification."
    use: "Контроль доступа может предотвращать подмену ИИ-артефактов и их неавторизованное изменение."
  - source: "Access controls can prevent tampering with ML artifacts and prevent unauthorized copying."
    use: "Контроль доступа может предотвращать подмену ML-артефактов и их неавторизованное копирование."
  - source: "Access controls can prevent theft of intellectual property."
    use: "Контроль доступа может предотвращать кражу интеллектуальной собственности."
  - source: "Access controls can reduce unnecessary access to AI models and prevent an adversary from achieving white-box access."
    use: "Контроль доступа может сократить избыточный доступ к ИИ-моделям и не дать злоумышленнику получить доступ в режиме белого ящика."
  - source: "Access controls on model APIs can deny adversaries the access required for black-box optimization methods."
    use: "Контроль доступа к API модели может лишить злоумышленников доступа, необходимого для методов оптимизации в режиме чёрного ящика."
  - source: "Access controls on model APIs can prevent an adversary from excessively querying and disabling the system."
    use: "Контроль доступа к API модели может помешать злоумышленнику выполнять чрезмерное количество запросов и выводить систему из строя."
  - source: "Access controls on model APIs can restrict an adversary's access required to generate adversarial data."
    use: "Средства контроля доступа к API модели могут ограничить необходимый злоумышленнику доступ для создания состязательных данных."
  - source: "Access controls on models APIs can reduce an adversary's ability to produce an accurate proxy model."
    use: "Контроль доступа к API моделей может снизить способность злоумышленника создать точную прокси-модель."
  - source: "Access controls on models and data at rest can help prevent full model access."
    use: "Контроль доступа к моделям и данным в состоянии покоя может помочь предотвратить полный доступ к модели."
  - source: "Access controls on models at rest can prevent an adversary's ability to verify attack efficacy."
    use: "Контроль доступа к моделям в состоянии покоя может помешать злоумышленнику проверять эффективность атаки."
  - source: "Adversaries can use unrestricted API access to build a proxy training dataset and reveal private information."
    use: "Злоумышленники могут использовать неограниченный доступ к API, чтобы собрать обучающий набор данных для прокси-модели и раскрыть приватную информацию."
  - source: "Adversaries can use unrestricted API access to gain information about a production system, stage attacks, and introduce malicious data to the system."
    use: "Злоумышленники могут использовать неограниченный доступ к API, чтобы получить сведения о продакшен-системе, подготовить атаки и внедрить в систему вредоносные данные."
  - source: "AI telemetry logging can help detect suspicious prompts, browser-based AI service interactions, URL-fetch requests, and AI responses used to relay command-and-control data."
    use: "Логирование телеметрии ИИ помогает выявлять подозрительные промпты, взаимодействия с ИИ-сервисами через браузер, запросы на получение URL и ответы ИИ, используемые для передачи данных командования и управления."
  - source: "Align generative AI models with safety objectives to reduce the likelihood that they will generate malicious commands or harmful instructions."
    use: "Выравнивайте модели генеративного ИИ в соответствии с целями безопасности, чтобы снизить вероятность генерации ими вредоносных команд или инструкций, способных причинить вред."
  - source: "Align generative models to resist and adversary's malicious requests and attempts to remove safety behavior."
    use: "Выравнивайте генеративные модели, чтобы они противостояли вредоносным запросам злоумышленника и попыткам устранить предусмотренное безопасное поведение."
  - source: "An AI BOM can help users identify untrustworthy binaries."
    use: "AI BOM может помочь пользователям выявлять недоверенные бинарные файлы."
  - source: "An AI BOM can help users identify untrustworthy components of their AI supply chain."
    use: "AI BOM может помочь пользователям выявлять недоверенные компоненты цепочки поставок ИИ."
  - source: "An AI BOM can help users identify untrustworthy model artifacts."
    use: "AI BOM может помочь пользователям выявлять недоверенные артефакты моделей."
  - source: "An AI BOM can help users identify untrustworthy software dependencies."
    use: "AI BOM может помочь пользователям выявлять недоверенные программные зависимости."
  - source: "An adversary could repackage the application with a malicious version of the model."
    use: "Злоумышленник может переупаковать приложение с вредоносной версией модели."
  - source: "Apply guardrails to block malicious use and jailbreak attempts against generative AI models or services."
    use: "Применяйте гардрейлы, чтобы блокировать вредоносное использование моделей или сервисов генеративного ИИ, а также попытки их джейлбрейка."
  - source: "Apply guardrails to untrusted web content and proposed computer-use actions."
    use: "Применяйте гардрейлы к недоверенному веб-содержимому и предлагаемым действиям по управлению компьютером."
  - source: "Apply input guardrails that decode, normalize, inspect, and block concealed malicious instructions."
    use: "Применяйте гардрейлы для входных данных, которые декодируют, нормализуют, анализируют и блокируют скрытые вредоносные инструкции."
  - source: "Apply retrieval guardrails to reject untrusted, malicious, irrelevant, or unsupported RAG content."
    use: "Применяйте гардрейлы для извлечения данных, чтобы отклонять недоверенное, вредоносное, нерелевантное или неподтверждённое содержимое RAG."
  - source: "Apply retrieval guardrails to reject untrusted, malicious, irrelevant, or unsupported tool-retrieved content."
    use: "Применяйте гардрейлы для извлечения данных, чтобы отклонять недоверенное, вредоносное, нерелевантное или неподтверждённое содержимое, извлечённое инструментами."
  - source: "Apply retrieval, input, and tool-action guardrails to detect and block malicious instructions embedded in websites before execution."
    use: "Применяйте гардрейлы для извлечения и входных данных, а также гардрейлы для инструментов и действий, чтобы обнаруживать и блокировать встроенные в веб-сайты вредоносные инструкции до их выполнения."
  - source: "Apply resource budgets to AI requests and workflows to limit costs from resource-intensive queries, excessive output, and uncontrolled agentic activity."
    use: "Устанавливайте бюджеты ресурсов для запросов к ИИ и рабочих процессов с использованием ИИ, чтобы ограничить затраты, возникающие из-за ресурсоёмких запросов, чрезмерного объёма выходных данных и неконтролируемой активности ИИ-агентов."
  - source: "Assess queries before inference call or enforce timeout policy for queries which consume excessive resources."
    use: "Оценивайте запросы до вызова инференса или применяйте политику таймаутов для запросов, потребляющих чрезмерные ресурсы."
  - source: "Attempt controlled modification or substitution of models, weights, adapters, and related configuration. Remediate weaknesses in authorization, artifact integrity, deployment approval, monitoring, and recovery."
    use: "В контролируемых условиях попытайтесь изменить или подменить модели, веса, адаптеры и связанную с ними конфигурацию. Устраните недостатки механизмов авторизации, обеспечения целостности артефактов, процедур одобрения развёртывания, мониторинга и восстановления."
  - source: "Attempt controlled unauthorized changes to model architecture or executable model components. Verify review, integrity checking, signing, deployment approval, and restoration controls."
    use: "В контролируемых условиях попытайтесь внести неавторизованные изменения в архитектуру модели или в её исполняемые компоненты. Проверьте процессы рассмотрения изменений, контроля целостности, подписания и одобрения развёртывания, а также механизмы восстановления."
  - source: "Attempt to persist malicious instructions in agent memory and long-lived threads. Verify authorization for context changes, integrity checks, trust labeling, expiration, user visibility, and remediation."
    use: "Попытайтесь добиться сохранения вредоносных инструкций в памяти ИИ-агента и в долгоживущих ветках диалога. Проверяйте наличие необходимых разрешений на изменение контекста, механизмы проверки целостности, маркировку уровня доверия, сроки действия, видимость для пользователя и меры по устранению последствий."
  - source: "Attempt to reconstruct sensitive records, attributes, or representative training information from model outputs. Remediate leakage through model changes, output minimization, privacy controls, and restricted inference access."
    use: "Попытайтесь реконструировать чувствительные записи, атрибуты или сведения, характерные для обучающих данных, на основе выходных данных модели. Устраните утечку за счёт внесения изменений в модель, минимизации выходных данных, мер защиты приватности и ограничения доступа к инференсу."
  - source: "Attempt to select unauthorized tools, supply unsafe arguments, exceed user privileges, or chain tools into harmful actions. Correct permissions, argument validation, sandboxing, action controls, and approval requirements."
    use: "Попытайтесь выбрать неавторизованные инструменты, передать небезопасные аргументы, выйти за пределы привилегий пользователя или выстроить цепочки вызовов инструментов для совершения действий, способных причинить вред. Устраните недостатки в настройке разрешений, валидации аргументов, изоляции в песочнице, средствах контроля действий и требованиях к одобрению."
  - source: "Attempt to store controlled malicious instructions or preferences in persistent agent memory. Verify authorization, user visibility, integrity validation, expiration, and memory-remediation controls."
    use: "Попытайтесь сохранить в долговременной памяти ИИ-агента контролируемое вредоносное содержимое — инструкции или предпочтения. Проверяйте наличие необходимых разрешений, видимость для пользователя, механизмы проверки целостности, сроки действия и средства устранения последствий отравления памяти."
  - source: "Authenticate AI service API callers and monitor queries for policy violations and misuse."
    use: "Аутентифицируйте субъектов, обращающихся к API ИИ-сервиса, и отслеживайте запросы на предмет нарушений политик и случаев неправомерного использования."
  - source: "Authenticate and monitor access to production models and configuration interfaces."
    use: "Требуйте аутентификации при доступе к моделям в продакшене и интерфейсам конфигурации и отслеживайте такой доступ."
  - source: "Authenticate and monitor access to production models and prompt configuration."
    use: "Требуйте аутентификации при доступе к моделям в продакшене и конфигурации промптов и отслеживайте такой доступ."
  - source: "Authenticate production AI endpoints and monitor model queries for misuse of otherwise valid credentials."
    use: "Требуйте аутентификации при доступе к ИИ-эндпоинтам в продакшене и отслеживайте запросы к модели, чтобы выявлять неправомерное использование действительных учётных данных."
  - source: "Authentication on production models can help prevent anonymous chaff data spam."
    use: "Аутентификация для моделей в продакшене может помочь предотвратить анонимный спам шумовыми данными."
  - source: "Avoid publicly disclosing agent activation keywords, events, and workflows."
    use: "Не раскрывайте в открытом доступе ключевые слова, события и рабочие процессы, используемые для активации ИИ-агента."
  - source: "Avoid publicly documenting sensitive agent tool definitions and capabilities."
    use: "Не публикуйте в открытом доступе документацию, раскрывающую чувствительные сведения об определениях и возможностях инструментов ИИ-агента."
  - source: "Avoiding  the deployment of models to edge devices reduces an adversary's potential access to models or AI artifacts."
    use: "Отказ от развертывания моделей на периферийных устройствах снижает потенциальный доступ злоумышленника к моделям или ИИ-артефактам."
  - source: "Avoiding the deployment of models to edge devices reduces an adversary's ability to collect sensitive information about the model outputs."
    use: "Отказ от развертывания моделей на периферийных устройствах снижает способность злоумышленника собирать чувствительную информацию о выходных данных модели."
  - source: "Avoiding the deployment of models to edge devices reduces the attack surface and can prevent adversary artifact collection."
    use: "Отказ от развертывания моделей на периферийных устройствах уменьшает поверхность атаки и может предотвратить сбор артефактов злоумышленником."
  - source: "Block malicious agent instructions, command outputs, and unsafe tool requests with guardrails."
    use: "С помощью гардрейлов блокируйте вредоносные инструкции для агента, результаты выполнения команд и небезопасные запросы к инструментам."
  - source: "Block malicious prompts, unsafe outputs, and prohibited agent actions with guardrails."
    use: "С помощью гардрейлов блокируйте вредоносные промпты, небезопасные выходные данные и запрещённые действия агента."
  - source: "Block output of system prompts, hidden instructions, secrets, and internal configuration details."
    use: "Блокируйте вывод системных промптов, скрытых инструкций, секретов и сведений о внутренней конфигурации."
  - source: "Block prompts and outputs that request or contain malicious commands."
    use: "Блокируйте промпты и выходные данные, которые запрашивают или содержат вредоносные команды."
  - source: "Bound input size, output size, execution time, memory, and compute consumed by resource-intensive queries."
    use: "Для ресурсоёмких запросов ограничивайте размер входных и выходных данных, время выполнения, потребление памяти и вычислительных ресурсов."
  - source: "Code signing provides a guarantee that the model has not been manipulated after signing took place."
    use: "Подписание кода дает гарантию, что модель не была изменена после подписания."
  - source: "Code signing provides a guarantee that the software package has not been manipulated after signing took place."
    use: "Подписание кода дает гарантию, что программный пакет не был изменен после подписания."
  - source: "Configuring AI Agent tools with access controls inherited from the user or the AI Agent invoking the tool can limit adversary's access to sensitive data."
    use: "Настройка инструментов ИИ-агента с контролем доступа, унаследованным от пользователя или вызывающего их ИИ-агента, может ограничить доступ злоумышленника к чувствительным данным."
  - source: "Configuring AI Agent tools with access controls inherited from the user or the AI Agent invoking the tool can limit an adversary's capabilities within a system, including their ability to abuse tool invocations and access sensitive data."
    use: "Настройка инструментов ИИ-агента с контролем доступа, унаследованным от пользователя или вызывающего их ИИ-агента, может ограничить возможности злоумышленника в системе, включая злоупотребление вызовами инструментов и доступ к чувствительным данным."
  - source: "Configuring AI Agent tools with access controls inherited from the user or the AI Agent invoking the tool can limit an adversary's capabilities within a system, including their ability to abuse tool invocations and exfiltrate sensitive data."
    use: "Настройка инструментов ИИ-агента с контролем доступа, унаследованным от пользователя или вызывающего их ИИ-агента, может ограничить возможности злоумышленника в системе, включая злоупотребление вызовами инструментов и эксфильтрацию чувствительных данных."
  - source: "Configuring AI Agent tools with access controls inherited from the user or the AI Agent invoking the tool can limit an adversary's capabilities within a system, including their ability to abuse tool invocations to destroy data."
    use: "Настройка инструментов ИИ-агента с контролем доступа, унаследованным от пользователя или вызывающего их ИИ-агента, может ограничить возможности злоумышленника в системе, включая злоупотребление вызовами инструментов для уничтожения данных."
  - source: "Configuring AI Agent tools with access controls that are inherited from the user or the AI Agent invoking the tool can limit adversary's access to sensitive data."
    use: "Настройка инструментов ИИ-агента с контролем доступа, унаследованным от пользователя или вызывающего их ИИ-агента, может ограничить доступ злоумышленника к чувствительным данным."
  - source: "Configuring AI agents with permissions that are inherited from the user can limit an adversary's ability to collect data from AI services if the agent is compromised."
    use: "Настройка ИИ-агентов с разрешениями, унаследованными от пользователя, может ограничить способность злоумышленника собирать данные из ИИ-сервисов при компрометации агента."
  - source: "Configuring AI agents with permissions that are inherited from the user can limit an adversary's ability to collect data from RAG Databases if the agent is compromised."
    use: "Настройка ИИ-агентов с разрешениями, унаследованными от пользователя, может ограничить способность злоумышленника собирать данные из баз данных RAG при компрометации агента."
  - source: "Configuring AI agents with permissions that are inherited from the user can limit an adversary's ability to collect data from agent tool invocation if the agent is compromised."
    use: "Настройка ИИ-агентов с разрешениями, унаследованными от пользователя, может ограничить способность злоумышленника собирать данные через вызов инструментов агента при компрометации агента."
  - source: "Configuring AI agents with permissions that are inherited from the user can limit an adversary's ability to harvest credentials from RAG Databases if the agent is compromised."
    use: "Настройка ИИ-агентов с разрешениями, унаследованными от пользователя, может ограничить способность злоумышленника собирать учетные данные из баз данных RAG при компрометации агента."
  - source: "Configuring AI agents with permissions that are inherited from the user for tool use can limit an adversary's ability to abuse tool invocations if the agent is compromised."
    use: "Настройка ИИ-агентов с разрешениями на использование инструментов, унаследованными от пользователя, может ограничить способность злоумышленника злоупотреблять вызовами инструментов при компрометации агента."
  - source: "Configuring privileged AI agents with proper access controls can limit an adversary's ability to collect data from AI services if the agent is compromised."
    use: "Надлежащий контроль доступа для привилегированных ИИ-агентов может ограничить способность злоумышленника собирать данные из ИИ-сервисов при компрометации агента."
  - source: "Configuring privileged AI agents with proper access controls can limit an adversary's ability to collect data from RAG Databases if the agent is compromised."
    use: "Надлежащий контроль доступа для привилегированных ИИ-агентов может ограничить способность злоумышленника собирать данные из баз данных RAG при компрометации агента."
  - source: "Configuring privileged AI agents with proper access controls can limit an adversary's ability to collect data from agent tool invocation if the agent is compromised."
    use: "Надлежащий контроль доступа для привилегированных ИИ-агентов может ограничить способность злоумышленника собирать данные через вызов инструментов агента при компрометации агента."
  - source: "Configuring privileged AI agents with proper access controls can limit an adversary's ability to harvest credentials from RAG Databases if the agent is compromised."
    use: "Надлежащий контроль доступа для привилегированных ИИ-агентов может ограничить способность злоумышленника собирать учетные данные из баз данных RAG при компрометации агента."
  - source: "Configuring privileged AI agents with proper access controls for tool use can limit an adversary's ability to abuse tool invocations if the agent is compromised."
    use: "Надлежащий контроль доступа к использованию инструментов привилегированными ИИ-агентами может ограничить способность злоумышленника злоупотреблять вызовами инструментов при компрометации агента."
  - source: "Controlling access to the model in production can help prevent adversaries from inferring information from the model outputs."
    use: "Контроль доступа к модели в продакшене может помочь помешать злоумышленникам извлекать информацию из выходных данных модели."
  - source: "Dataset repositories inspect submissions and quarantine poisoned samples, labels, annotations, or metadata before listing."
    use: "Репозитории наборов данных проверяют поступающие материалы и до публикации в каталоге помещают в карантин отравленные образцы данных, метки, аннотации или метаданные."
  - source: "Dataset provenance can protect against poisoning of models."
    use: "Сведения о происхождении наборов данных могут защищать от отравления моделей."
  - source: "Dataset provenance can protect against poisoning of training data"
    use: "Сведения о происхождении наборов данных могут защищать от отравления обучающих данных."
  - source: "Dataset provenance can protect against supply chain compromise of data."
    use: "Сведения о происхождении наборов данных могут защищать от компрометации данных в цепочке поставок."
  - source: "Deepfake detection can be used to identify and block generated content."
    use: "Обнаружение дипфейков можно использовать для выявления и блокировки сгенерированного контента."
  - source: "Deepfake detection can be used to identify and block phishing attempts that use generated content."
    use: "Обнаружение дипфейков можно использовать для выявления и блокировки фишинговых попыток, использующих сгенерированный контент."
  - source: "Deploy technical controls to detect and block synthetic audio and video. This includes AI-based analysis tools that examine media for artifacts indicative deepfakes."
    use: "Разверните технические средства контроля для обнаружения и блокировки синтетического аудио и видео. К ним относятся инструменты анализа на основе ИИ, которые проверяют медиа на артефакты, указывающие на дипфейки."
  - source: "Detect and remove or remediate poisoned data to avoid adversarial model drift or backdoor attacks."
    use: "Выявляйте и удаляйте отравленные данные либо устраняйте их последствия, чтобы избежать состязательного дрейфа модели или бэкдор-атак."
  - source: "Detect modification of data and labels which may cause adversarial model drift or backdoor attacks."
    use: "Выявляйте изменения данных и меток, которые могут вызвать состязательный дрейф модели или бэкдор-атаки."
  - source: "Determine validity of published data in order to avoid using poisoned data that introduces vulnerabilities."
    use: "Проверяйте достоверность опубликованных данных, чтобы не использовать отравленные данные, создающие уязвимости."
  - source: "Encrypting AI artifacts can protect against adversary attempts to discover sensitive information."
    use: "Шифрование ИИ-артефактов может защитить от попыток злоумышленника выявить чувствительную информацию."
  - source: "Encrypting model outputs can prevent adversaries from discovering sensitive information about the AI-enabled system or its operations."
    use: "Шифрование выходных данных модели может помешать злоумышленникам выявлять чувствительную информацию об ИИ-системе или ее операциях."
  - source: "Enforce authorization and monitor production AI API use for anomalous activity associated with replayed access tokens."
    use: "Обеспечивайте обязательную авторизацию и отслеживайте использование API ИИ в продакшене на предмет аномальной активности, связанной с повторным предъявлением токенов доступа."
  - source: "Enforce properly signed drivers and ML software frameworks."
    use: "Требуйте корректной подписи драйверов и ML-фреймворков."
  - source: "Enforce properly signed model files."
    use: "Требуйте корректной подписи файлов модели."
  - source: "Ensure that acquired models do not respond to potential backdoor triggers or adversarial influence."
    use: "Убедитесь, что приобретенные модели не реагируют на потенциальные бэкдор-триггеры или состязательное воздействие."
  - source: "Ensure that trained models do not respond to potential backdoor triggers or adversarial influence."
    use: "Убедитесь, что обученные модели не реагируют на потенциальные бэкдор-триггеры или состязательное воздействие."
  - source: "Exercise inference interfaces for membership inference, model inversion, and functional extraction. Use findings to improve privacy controls, authentication, output restriction, rate limits, and monitoring."
    use: "Испытайте интерфейсы инференса с помощью методов определения принадлежности к обучающей выборке, инверсии ИИ-модели и извлечения функциональной копии ИИ-модели. Используйте полученные результаты для совершенствования мер защиты приватности, аутентификации, ограничений на выходные данные, лимитов частоты запросов и мониторинга."
  - source: "Exercise manual and automated multi-turn, multilingual, encoded, transformed, and multimodal jailbreaks. Incorporate successful cases into guardrails, guidelines, alignment, monitoring, and regression evaluations."
    use: "Отрабатывайте различные варианты джейлбрейка: выполняемые вручную и автоматизированные, многоходовые, многоязычные, закодированные, преобразованные и мультимодальные. Используйте успешные случаи джейлбрейка для совершенствования гардрейлов, рекомендаций, выравнивания модели и мониторинга, а также включайте их в регрессионные оценки."
  - source: "Exercise requests and workflows designed to amplify inference, infrastructure, or external-service costs. Verify budgets, quotas, rate limits, workload controls, alerting, and termination mechanisms."
    use: "Отрабатывайте сценарии с запросами и рабочими процессами, предназначенными для увеличения затрат на инференс, инфраструктуру или внешние сервисы. Проверяйте бюджеты, квоты, ограничения частоты запросов, средства управления рабочими нагрузками, систему оповещения и механизмы остановки."
  - source: "Exercise the introduction of controlled untrusted software, data, models, and agent tools through representative acquisition and deployment paths. Remediate weaknesses in provenance, validation, approvals, isolation, and rollback."
    use: "Отработайте в контролируемых условиях внедрение недоверенных компонентов — ПО, данных, моделей и инструментов ИИ-агента — через репрезентативные пути их получения и развёртывания. Устраните недостатки, связанные со сведениями о происхождении, валидацией, процедурами одобрения, изоляцией и откатом."
  - source: "Exercise unauthorized changes to system prompts, tools, knowledge sources, security settings, and approval requirements. Improve access controls, change approval, integrity monitoring, and restoration from trusted configurations."
    use: "Отрабатывайте сценарии неавторизованных изменений системных промптов, инструментов, источников знаний, настроек безопасности и требований к одобрению. Совершенствуйте средства контроля доступа, процедуры одобрения изменений, мониторинг целостности и механизмы восстановления системы на основе доверенных конфигураций."
  - source: "Execute representative digital, multimodal, and physical-domain evasion attacks. Use successful attacks to improve model robustness, preprocessing, adversarial-input detection, human oversight, and monitoring."
    use: "Проведите репрезентативные цифровые и мультимодальные атаки обхода, а также атаки обхода в физическом домене. Используйте успешные атаки, чтобы повысить устойчивость модели и улучшить предобработку, обнаружение состязательных входных данных, контроль со стороны человека и мониторинг."
  - source: "Filter responses that expose hidden prompt formatting, delimiters, or internal instructions."
    use: "Фильтруйте ответы, раскрывающие скрытое форматирование промпта, разделители или внутренние инструкции."
  - source: "Filter responses that reveal system keywords, tool names, function definitions, or hidden instructions."
    use: "Фильтруйте ответы, раскрывающие системные ключевые слова, имена инструментов, определения функций или скрытые инструкции."
  - source: "Filter responses that reveal system prompts and hidden instructions."
    use: "Фильтруйте ответы, раскрывающие системные промпты и скрытые инструкции."
  - source: "Generate controlled high-volume query activity. Verify authentication, user and tenant quotas, rate limits, anomaly detection, cost alerts, and service protection."
    use: "В контролируемых условиях генерируйте интенсивный поток запросов. Проверяйте аутентификацию, квоты пользователей и тенантов, ограничения частоты запросов, обнаружение аномалий, оповещения о затратах и средства защиты сервиса."
  - source: "Guardrails can detect harmful code in model outputs."
    use: "Гардрейлы могут обнаруживать вредоносный код в выходных данных модели."
  - source: "Guardrails can detect sensitive data and PII in model outputs."
    use: "Гардрейлы могут обнаруживать чувствительные данные и персональные данные в выходных данных модели."
  - source: "Guardrails can help block hallucinated content that appears in model output."
    use: "Гардрейлы могут помогать блокировать галлюцинированный контент в выходных данных модели."
  - source: "Guardrails can help prevent replication attacks in model inputs and outputs."
    use: "Гардрейлы могут помогать предотвращать атаки репликации во входных и выходных данных модели."
  - source: "Guardrails can prevent harmful inputs that can lead to a jailbreak."
    use: "Гардрейлы могут предотвращать вредоносные входные данные, способные привести к джейлбрейку."
  - source: "Guardrails can prevent harmful inputs that can lead to meta prompt extraction."
    use: "Гардрейлы могут предотвращать вредоносные входные данные, способные привести к извлечению метапромпта."
  - source: "Guardrails can prevent harmful inputs that can lead to plugin compromise, and they can detect PII in model outputs."
    use: "Гардрейлы могут предотвращать вредоносные входные данные, способные привести к компрометации плагина, и обнаруживать персональные данные в выходных данных модели."
  - source: "Guardrails can prevent harmful inputs that can lead to prompt injection."
    use: "Гардрейлы могут предотвращать вредоносные входные данные, способные привести к промпт-инъекции."
  - source: "Guidelines can help instruct the model to produce more secure output, preventing the model from generating self-replicating outputs."
    use: "Инструкции могут направлять модель к созданию более безопасных выходных данных и предотвращать генерацию самореплицирующихся выходных данных."
  - source: "Guidelines can instruct the model to avoid producing hallucinated content."
    use: "Инструкции могут указывать модели избегать генерации галлюцинированного контента."
  - source: "Hardened models are less susceptible to integrity attacks."
    use: "Модели с повышенной устойчивостью менее подвержены атакам на целостность."
  - source: "Hardened models are more difficult to evade."
    use: "Модели с повышенной устойчивостью труднее обойти."
  - source: "Hardened models are more robust to adversarial inputs."
    use: "Модели с повышенной устойчивостью лучше противостоят состязательным входным данным."
  - source: "Incorporate adversarial input detection into the pipeline before inputs reach the model."
    use: "Встраивайте обнаружение состязательных входных данных в пайплайн до того, как входные данные достигнут модели."
  - source: "Incorporate adversarial input detection to block malicious inputs at inference time."
    use: "Встраивайте обнаружение состязательных входных данных, чтобы блокировать вредоносные входные данные во время инференса."
  - source: "Input restoration adds an extra layer of unknowns and randomness when an adversary evaluates the input-output relationship."
    use: "Восстановление входных данных добавляет дополнительный слой неопределенности и случайности, когда злоумышленник оценивает связь между входом и выходом."
  - source: "Input restoration can help remediate adversarial inputs."
    use: "Восстановление входных данных может помогать исправлять состязательные входные данные."
  - source: "Instruct agents to treat webpage instructions as untrusted and request approval for consequential actions."
    use: "Предписывайте ИИ-агентам считать содержащиеся на веб-страницах инструкции недоверенными и запрашивать одобрение на выполнение действий, способных повлечь существенные последствия."
  - source: "Introduce a controlled untrusted agent tool or tool definition. Verify source authorization, integrity, review, permission boundaries, and safe activation."
    use: "Внедряйте недоверенный инструмент ИИ-агента или недоверенное определение инструмента только в контролируемую среду. Убедитесь, что источник входит в число разрешённых; проверьте целостность, факт проведения проверки, границы разрешений и безопасность активации."
  - source: "Introduce a controlled untrusted or modified model through representative acquisition and deployment paths. Verify provenance, scanning, signing, approval, isolation, and rollback."
    use: "Внедряйте недоверенную или модифицированную модель только в контролируемую среду через репрезентативные пути её получения и развёртывания. Проверьте сведения о происхождении, сканирование, подписание, процедуры одобрения, изоляцию и возможность возврата к предыдущей версии модели."
  - source: "Introduce controlled malicious instructions into long-lived or shared conversation threads. Verify context isolation, trust handling, thread reset, expiration, and monitoring."
    use: "Внедряйте контролируемые вредоносные инструкции в долгоживущие цепочки сообщений или цепочки сообщений с общим доступом. Проверяйте изоляцию контекста и его обработку с учётом уровня доверия, сброс цепочек сообщений, сроки действия и мониторинг."
  - source: "Introduce controlled untrusted AI packages, libraries, plugins, or software components. Verify dependency controls, scanning, signing, approval, isolation, and safe installation."
    use: "Внедряйте недоверенные пакеты ПО для ИИ, библиотеки, плагины или программные компоненты только в контролируемую среду. Проверьте средства контроля зависимостей, сканирование, подписание, процедуры одобрения, изоляцию и безопасность установки."
  - source: "Introduce controlled untrusted datasets through representative acquisition and ingestion paths. Verify provenance, integrity, sanitization, review, and rejection controls."
    use: "Внедряйте недоверенные наборы данных только в контролируемую среду через репрезентативные пути их получения и приёма. Проверьте механизмы отслеживания происхождения, обеспечения целостности, санитизации, проверки и отбраковки данных."
  - source: "Introduce controlled poisoned records or triggers into representative data pipelines. Verify and improve provenance, sanitization, review, drift detection, model validation, and rollback controls."
    use: "В контролируемых условиях внедрите отравленные записи или триггеры в репрезентативные пайплайны обработки данных. Проверьте и усовершенствуйте отслеживание происхождения данных, их санитизацию и проверку, обнаружение дрейфа, валидацию модели и механизмы возврата к предыдущему состоянию."
  - source: "Introduce proper checking of signatures to ensure that unsafe AI artifacts will not be executed in the system."
    use: "Внедрите надлежащую проверку подписей, чтобы небезопасные ИИ-артефакты не выполнялись в системе."
  - source: "Introduce proper checking of signatures to ensure that unsafe AI artifacts will not be introduced to the system."
    use: "Внедрите надлежащую проверку подписей, чтобы небезопасные ИИ-артефакты не попадали в систему."
  - source: "Introduce proper checking of signatures to ensure that unsafe AI data will not be introduced to the system."
    use: "Внедрите надлежащую проверку подписей, чтобы небезопасные ИИ-данные не попадали в систему."
  - source: "Introduce proper checking of signatures to ensure that unsafe AI models will not be introduced to the system."
    use: "Внедрите надлежащую проверку подписей, чтобы небезопасные ИИ-модели не попадали в систему."
  - source: "Limit agent iterations, tool calls, fan-out, runtime, and downstream spending to constrain agentic resource consumption."
    use: "Ограничивайте число итераций агента и вызовов инструментов, степень ветвления, продолжительность выполнения и расходы, возникающие при обращении к нижестоящим сервисам, чтобы удерживать потребление ресурсов агентом в заданных пределах."
  - source: "Limit disclosure of the production AI stack and system-specific technical details that let adversaries connect public vulnerability research to the deployed target."
    use: "Ограничивайте раскрытие сведений об ИИ-стеке, используемом в продакшене, и технических подробностей конкретной системы, которые позволяют злоумышленникам соотнести результаты общедоступных исследований уязвимостей с развёрнутой целевой системой."
  - source: "Limit inference queries to reduce the labeled outputs available for training a proxy model."
    use: "Ограничивайте запросы на инференс, чтобы сократить объём размеченных выходных данных, доступных для обучения прокси-модели."
  - source: "Limit inference queries to reduce an adversary's ability to discover the model's full output ontology."
    use: "Ограничивайте запросы на инференс, чтобы снизить способность злоумышленника выявить полную онтологию выходных данных модели."
  - source: "Limit inference queries to reduce an adversary's ability to infer the family of AI model."
    use: "Ограничивайте запросы на инференс, чтобы снизить способность злоумышленника определить семейство ИИ-модели."
  - source: "Limit public disclosure of agent call chains and execution-sink details."
    use: "Ограничивайте публичное раскрытие цепочек вызовов ИИ-агента и сведений о точках, в которых эти цепочки приводят к выполнению кода."
  - source: "Limit public disclosure of agent tools, services, configuration, and workflows."
    use: "Ограничивайте публичное раскрытие сведений об инструментах, сервисах, конфигурации и рабочих процессах ИИ-агента."
  - source: "Limit public release of production model artifacts that adversaries could acquire and adapt as operational capabilities."
    use: "Ограничивайте публикацию в открытом доступе артефактов моделей, используемых в продакшене: злоумышленники могут получить такие артефакты и адаптировать их для использования в своих операциях."
  - source: "Limit public technical and organizational information that reveals the AI stack, services, personnel, or other targeting details on websites and domains."
    use: "Ограничивайте размещение на веб-сайтах и доменах общедоступной технической и организационной информации, раскрывающей ИИ-стек, сервисы, сведения о сотрудниках или другие данные, полезные для выбора целей."
  - source: "Limit repeated prompts used to search for exploitable hallucinations."
    use: "Ограничивайте повторные промпты, используемые для поиска галлюцинаций, пригодных для эксплуатации."
  - source: "Limit repeated queries used to test and refine an attack against the target model."
    use: "Ограничивайте повторные запросы, используемые для проверки и доработки атаки на целевую модель."
  - source: "Limit the connection between publicly disclosed approaches and the data, models, and algorithms used in production."
    use: "Ограничьте связь между публично раскрытыми подходами и данными, моделями и алгоритмами, используемыми в продакшене."
  - source: "Limit the number of queries users can perform in a given interval to hinder an attacker's ability to send computationally expensive inputs"
    use: "Ограничьте количество запросов, которые пользователи могут выполнять за заданный интервал, чтобы затруднить злоумышленнику отправку вычислительно затратных входных данных."
  - source: "Limit the number of queries users can perform in a given interval to prevent a denial of service."
    use: "Ограничьте количество запросов, которые пользователи могут выполнять за заданный интервал, чтобы предотвратить отказ в обслуживании."
  - source: "Limit the release of sensitive information in the metadata of deployed systems and publicly available applications."
    use: "Ограничьте публикацию чувствительной информации в метаданных развернутых систем и публично доступных приложений."
  - source: "Limit the resources consumed by individual requests to reduce denial of service from computationally expensive inputs."
    use: "Ограничивайте объём ресурсов, потребляемых отдельными запросами, чтобы снизить риск отказа в обслуживании ИИ-сервиса из-за входных данных, требующих значительных вычислительных ресурсов."
  - source: "Limit the volume of API queries in a given period of time to regulate the amount and fidelity of potentially sensitive information an attacker can learn."
    use: "Ограничьте объем API-запросов за заданный период, чтобы регулировать объем и детализацию потенциально чувствительной информации, которую может получить злоумышленник."
  - source: "Limit volume and rate of queries to protect the system from chaff data spam."
    use: "Ограничивайте объём и частоту запросов, чтобы защитить систему от спама шумовыми данными."
  - source: "Limit volume of model queries to prevent or slow an adversary's ability to create adversarial inputs."
    use: "Ограничивайте объём запросов к модели, чтобы помешать злоумышленнику создавать состязательные входные данные или замедлить их создание."
  - source: "Limit volume of model queries to prevent or slow an adversary's ability to perform black-box optimization attacks."
    use: "Ограничивайте объём запросов к модели, чтобы помешать злоумышленнику проводить атаки с оптимизацией в режиме чёрного ящика или замедлить проведение таких атак."
  - source: "Limit volume of model queries to prevent or slow an adversary's ability to refine manually crafted adversarial inputs."
