  - source: "Telemetry logging can help identify if sensitive data has been exfiltrated."
    use: "Логирование телеметрии может помочь выявить эксфильтрацию чувствительных данных."
  - source: "Telemetry logging can help identify if sensitive model information has been sent to an attacker."
    use: "Логирование телеметрии может помочь выявить отправку чувствительной информации о модели злоумышленнику."
  - source: "Telemetry logging can help identify if unsafe prompts have been submitted to the LLM."
    use: "Логирование телеметрии может помочь выявить отправку небезопасных промптов в LLM."
  - source: "Test direct, indirect, and triggered instructions through user input, retrieved data, documents, messages, websites, images, metadata, and tool output. Remediate trust-boundary, instruction-handling, permission, and monitoring failures."
    use: "Тестируйте прямые, косвенные и срабатывающие по триггеру инструкции, передаваемые через пользовательский ввод, извлечённые данные, документы, сообщения, веб-сайты, изображения, метаданные и выходные данные инструментов. Устраняйте недостатки в обеспечении границ доверия, обработке инструкций, управлении разрешениями и мониторинге."
  - source: "Test encoded, transformed, visually hidden, multilingual, and multimodal instructions. Use successful bypasses to improve normalization, decoding, content inspection, and detection controls."
    use: "Тестируйте закодированные, преобразованные, визуально скрытые, многоязычные и мультимодальные инструкции. Используйте случаи успешного обхода для совершенствования нормализации, декодирования, анализа содержимого и средств обнаружения."
  - source: "Test recursive behavior, repeated tool calls, costly API use, and attacker-controlled task expansion. Verify budgets, iteration limits, timeouts, approval thresholds, and termination controls."
    use: "Тестируйте рекурсивное поведение, повторные вызовы инструментов, использование API, приводящее к высоким затратам, и расширение области задачи под контролем злоумышленника. Проверяйте бюджеты, ограничения числа итераций, таймауты, пороги обязательного одобрения и средства остановки выполнения."
  - source: "Test whether controlled changes to model weights, fine-tuning, or associated artifacts can introduce targeted or persistent behavior. Improve model provenance, validation, integrity monitoring, and rollback."
    use: "Проверьте, могут ли контролируемые изменения весов модели, контролируемое дообучение или контролируемые изменения связанных с моделью артефактов привести к появлению целевого или устойчивого поведения. Усовершенствуйте отслеживание происхождения модели, её валидацию и мониторинг целостности, а также механизм возврата к предыдущей версии."
  - source: "Test whether model outputs reveal the membership of known training samples. Improve privacy-preserving training, output restriction, access controls, and query monitoring."
    use: "Проверьте, позволяют ли выходные данные модели определить, входили ли известные образцы данных в её обучающую выборку. Усовершенствуйте обучение с сохранением приватности, ограничения на выходные данные, контроль доступа и мониторинг запросов."
  - source: "Tool registries scan uploaded tool packages and dependencies for malicious code and vulnerabilities before listing."
    use: "Реестры инструментов сканируют загружаемые пакеты инструментов и их зависимости на наличие вредоносного кода и уязвимостей перед добавлением в каталог."
  - source: "Train users on deepfake threats, including how to recognize synthetic voice, video, and text. Recommend verification through independent channels (e.g. known call-back number) before processing sensitive requests or providing sensitive information via voice or video calls."
    use: "Обучайте пользователей угрозам, связанным с дипфейками, в том числе распознаванию синтетического голоса, видео и текста. Рекомендуйте проверку по независимым каналам, например по известному номеру для обратного звонка, перед обработкой чувствительных запросов или предоставлением чувствительной информации по голосовой или видеосвязи."
  - source: "Train users to identify attempts of manipulation to prevent them from running unsafe code from external packages."
    use: "Обучайте пользователей распознавать попытки манипуляции, чтобы они не запускали небезопасный код из внешних пакетов."
  - source: "Train users to identify attempts of manipulation to prevent them from running unsafe code which when executed could develop unsafe artifacts. These artifacts may have a detrimental effect on the system."
    use: "Обучайте пользователей распознавать попытки манипуляции, чтобы они не запускали небезопасный код, который при выполнении может создать небезопасные артефакты. Такие артефакты могут негативно повлиять на систему."
  - source: "Train users to identify phishing attempts and understand that AI can be used to generate targeted and convincing messages."
    use: "Обучайте пользователей распознавать попытки фишинга и понимать, что ИИ может использоваться для генерации адресных и убедительных сообщений."
  - source: "Train users to identify phishing attempts by an adversary to reduce the risk of successful spearphishing, social engineering, and other techniques that involve user interaction."
    use: "Обучайте пользователей распознавать фишинговые попытки злоумышленника, чтобы снизить риск успешного целевого фишинга, социальной инженерии и других техник с участием пользователя."
  - source: "Training users to be able to identify attempts at manipulation will make them less susceptible to performing techniques that cause the execution of malicious code."
    use: "Обучение пользователей распознаванию попыток манипуляции снижает вероятность того, что они выполнят действия, приводящие к запуску вредоносного кода."
  - source: "Use access controls in production to prevent adversaries from injecting malicious prompts."
    use: "Используйте контроль доступа в продакшене, чтобы помешать злоумышленникам внедрять вредоносные промпты."
  - source: "Use access controls in production to prevent adversary's ability to verify attack efficacy."
    use: "Используйте контроль доступа в продакшене, чтобы помешать злоумышленнику проверять эффективность атаки."
  - source: "Use multiple different models to fool adversaries of which type of model is used and how the model used."
    use: "Используйте несколько разных моделей, чтобы запутать злоумышленников относительно типа используемой модели и способа ее применения."
  - source: "Using a variety of sensors can make it more difficult for an attacker to compromise and produce malicious results."
    use: "Использование разных сенсоров может затруднить злоумышленнику компрометацию системы и получение вредоносных результатов."
  - source: "Using a variety of sensors can make it more difficult for an attacker with physical access to compromise and produce malicious results."
    use: "Использование разных сенсоров может затруднить злоумышленнику с физическим доступом компрометацию системы и получение вредоносных результатов."
  - source: "Using a variety of sensors, such as IR depth cameras, can aid in detecting deepfakes."
    use: "Использование разных сенсоров, например инфракрасных камер глубины, может помогать обнаруживать дипфейки."
  - source: "Using an ensemble of models increases the difficulty of crafting effective adversarial data and improves overall robustness."
    use: "Использование ансамбля моделей усложняет создание эффективных состязательных данных и повышает общую устойчивость."
  - source: "Using multiple different models ensures minimal performance loss if security flaw is found in tool for one model or family."
    use: "Использование нескольких разных моделей обеспечивает минимальную потерю производительности, если уязвимость обнаружена в инструменте для одной модели или семейства моделей."
  - source: "Using multiple different models increases robustness to attack."
    use: "Использование нескольких разных моделей повышает устойчивость к атакам."
  - source: "Validate retrieved documents and block nested false entries, malicious instructions, and unsupported content."
    use: "Валидируйте извлечённые документы и блокируйте вложенные ложные записи, вредоносные инструкции и неподтверждённое содержимое."
  - source: "Validating an AI model against a wide range of adversarial inputs can help increase confidence that the model has not been manipulated."
    use: "Проверка ИИ-модели на широком наборе состязательных входных данных может повысить уверенность в том, что модель не подвергалась манипуляциям."
  - source: "Validating an AI model against adversarial data can ensure the model is performing as intended and is robust to adversarial inputs."
    use: "Проверка ИИ-модели на состязательных данных помогает убедиться, что модель работает как задумано и устойчива к состязательным входным данным."
  - source: "Validating that an AI model does not respond to backdoor triggers can help increase confidence that the model has not been poisoned."
    use: "Проверка того, что ИИ-модель не реагирует на бэкдор-триггеры, может повысить уверенность в том, что модель не была отравлена."
  - source: "Validation can prevent adversaries from executing prompt injections that could affect agentic workflows."
    use: "Валидация может помешать злоумышленникам выполнять промпт-инъекции, способные повлиять на агентные рабочие процессы."
  - source: "Validation can prevent adversaries from utilizing tools in an agentic workflow to compromise sensitive data sources."
    use: "Валидация может помешать злоумышленникам использовать инструменты в агентном рабочем процессе для компрометации источников чувствительных данных."
  - source: "Validation can prevent adversaries from utilizing tools in an agentic workflow to generate unsafe output."
    use: "Валидация может помешать злоумышленникам использовать инструменты в агентном рабочем процессе для генерации небезопасных выходных данных."
  - source: "Verify identities before granting access to model registries so newly established accounts cannot automatically access protected AI artifacts."
    use: "Проверяйте идентичность субъекта перед предоставлением доступа к реестрам моделей, чтобы вновь созданные учётные записи не получали автоматического доступа к защищённым ИИ-артефактам."
  - source: "Verify identities before granting production AI access so newly established accounts cannot automatically access protected AI services."
    use: "Проверяйте идентичность субъекта, прежде чем предоставлять ему доступ к ИИ-системам в продакшене, чтобы вновь созданные учётные записи не получали автоматического доступа к защищённым ИИ-сервисам."
  - source: "Vulnerability scanning can help identify malicious AI artifacts, such as models or data, and prevent user execution."
    use: "Сканирование уязвимостей может помочь выявлять вредоносные ИИ-артефакты, такие как модели или данные, и предотвращать их выполнение пользователем."
  - source: "Vulnerability scanning can help identify malicious binaries and prevent user execution."
    use: "Сканирование уязвимостей может помочь выявлять вредоносные бинарные файлы и предотвращать их выполнение пользователем."
  - source: "Vulnerability scanning can help identify malicious packages and prevent user execution."
    use: "Сканирование уязвимостей может помочь выявлять вредоносные пакеты и предотвращать их выполнение пользователем."
  - source: "Vulnerability scanning identifies and remediates software flaws before they can be exploited to obtain credentials."
    use: "Сканирование уязвимостей выявляет и устраняет дефекты ПО до того, как злоумышленники смогут эксплуатировать их для получения учётных данных."
  - source: "Vulnerability scanning reduces opportunities for adversaries to exploit weaknesses in artifact processing pipelines."
    use: "Сканирование уязвимостей сокращает возможности злоумышленников эксплуатировать недостатки в пайплайнах обработки артефактов."
  - source: "Vulnerability scanning reduces opportunities for adversaries to exploit weaknesses in remote services."
    use: "Сканирование уязвимостей сокращает возможности злоумышленников эксплуатировать недостатки в удалённых сервисах."
  - source: "Vulnerability scanning reduces opportunities for adversaries to exploit weaknesses that bypass security controls."
    use: "Сканирование уязвимостей сокращает возможности злоумышленников эксплуатировать недостатки, позволяющие обходить средства защиты."
  - source: "When an organization has sufficient administrative control over an AI system to enforce delegation constraints, propagating the parent agent's authority constraints to sub-agents prevents autonomous orchestration from creating or directing executors with broader targets, permissions, or permitted actions than the originating agent. These controls do not constrain adversary-controlled multi-agent systems over which the organization has no administrative control."
    use: "Если организация обладает достаточным уровнем административного контроля над ИИ-системой, чтобы обеспечивать соблюдение ограничений на делегирование, распространение ограничений полномочий родительского агента на субагентов не позволяет в ходе автономной оркестрации создавать исполнителей или управлять ими, если круг их целевых объектов, набор разрешений либо перечень разрешённых действий шире, чем у исходного агента. Эти средства контроля не ограничивают подконтрольные злоумышленнику многоагентные системы, над которыми у организации нет административного контроля."
  - source: "When an organization has sufficient administrative control over an AI system to enforce its authority boundaries, Authority Expansion Controls can directly constrain enabling objectives that seek new authorities, identities, execution environments, tools, communication paths, or trust relationships. These controls do not constrain adversary-controlled AI systems over which the organization has no administrative control."
    use: "Если организация обладает достаточным уровнем административного контроля над ИИ-системой, чтобы обеспечивать соблюдение установленных для неё границ полномочий, контроль расширения полномочий ИИ-агента может непосредственно ограничивать достижение вспомогательных целей, направленных на получение новых полномочий, идентичностей, сред выполнения, инструментов, каналов связи или отношений доверия. Эти средства контроля не ограничивают подконтрольные злоумышленнику ИИ-системы, над которыми у организации нет административного контроля."
  - source: "When an organization has sufficient administrative control over an AI system to enforce target restrictions, treating newly discovered targets and resources as outside the authorized boundary prevents autonomous reconnaissance from automatically expanding the agent's permitted target set or actively probing those targets without approval. These controls do not constrain reconnaissance performed by adversary-controlled AI systems over which the organization has no administrative control."
    use: "Если организация обладает достаточным уровнем административного контроля над ИИ-системой, чтобы обеспечивать соблюдение ограничений на выбор целевых объектов, вновь обнаруженные целевые объекты и ресурсы следует считать находящимися за пределами установленных границ полномочий. Это не позволяет агенту в ходе автономной разведки автоматически расширять разрешённый ему перечень целевых объектов или без одобрения проводить активное зондирование этих объектов. Эти средства контроля не ограничивают разведку, проводимую подконтрольными злоумышленнику ИИ-системами, над которыми у организации нет административного контроля."
  - source: "When an organization has sufficient administrative control over an AI system to monitor its planning and coordination activity, changes in task hierarchy, assignments, resource allocation, and newly initiated work provide observable signals that the orchestrator may be drifting from its authorized objective. This control does not apply to adversary-controlled AI systems over which the organization has no administrative control."
    use: "Если организация обладает достаточным уровнем административного контроля над ИИ-системой, чтобы отслеживать её действия по планированию и координации, изменения в иерархии задач, распределении заданий между исполнителями и выделении ресурсов, а также начало новых работ служат наблюдаемыми признаками того, что оркестратор может отклоняться от утверждённой цели. Эта мера неприменима к подконтрольным злоумышленнику ИИ-системам, над которыми у организации нет административного контроля."
  - source: "When an organization has sufficient administrative control over an AI system to monitor its plans and actions, Scope Drift Detection evaluates whether dynamically generated intermediate actions are within the agent's task scope. This control does not apply to adversary-controlled AI systems over which the organization has no administrative control."
    use: "Если организация обладает достаточным уровнем административного контроля над ИИ-системой, чтобы отслеживать её планы и действия, выявление отклонений ИИ-агента от установленной области действий позволяет проверить, остаются ли динамически формируемые промежуточные действия в рамках поставленной агенту задачи. Эта мера неприменима к подконтрольным злоумышленнику ИИ-системам, над которыми у организации нет административного контроля."
  - source: "When an organization has sufficient administrative control over an AI system to monitor its target selection and reconnaissance activity, Scope Drift Detection can identify when reconnaissance expands or substitutes targets in ways no longer consistent with the authorized objective. This control does not apply to adversary-controlled AI systems over which the organization has no administrative control."
    use: "Если организация обладает достаточным уровнем административного контроля над ИИ-системой, чтобы отслеживать выбор этой системой целевых объектов и её разведывательные действия, выявление отклонений ИИ-агента от установленной области действий позволяет определить, когда в ходе разведки перечень целевых объектов расширяется либо одни объекты заменяются другими, причём такие изменения уже не соответствуют утверждённой цели. Эта мера неприменима к подконтрольным злоумышленнику ИИ-системам, над которыми у организации нет административного контроля."
  - source: "With full access to the model, an adversary could perform white-box attacks."
    use: "При полном доступе к модели злоумышленник может проводить атаки в режиме белого ящика."
  - source: "Withhold public documentation that identifies RAG data sources, indexes, and retrieval architecture."
    use: "Не публикуйте в открытом доступе документацию с описанием источников данных и индексов RAG-системы, а также её архитектуры извлечения."
  - source: "Withhold public prompt templates, model configuration, and architecture details that could aid LLM reconnaissance."
    use: "Не публикуйте в открытом доступе шаблоны промптов, конфигурацию модели и сведения об архитектуре, которые могут облегчить предварительный сбор сведений об LLM."
objects:
  "AML.CS0000":
    name: "Обход детектора C&C-трафика вредоносного ПО на основе глубокого обучения"
    source:
      name_sha256: "3f109b6c091cc8f34a9285b4a5fd748d393f9df5a6262c8d5702aa3395649656"
      summary_sha256: "e34a10a4c47d201fed3f9ddf98e7a75469d835d5972a484c042795042fc3d4f0"
    summary: |-
      Исследовательская группа Security AI компании Palo Alto Networks протестировала модель глубокого обучения для обнаружения трафика командования и управления (C&C) вредоносного ПО в HTTP-трафике.

      На основе общедоступной статьи [Le и соавт.](https://arxiv.org/abs/1802.03162) мы построили модель, обученную на наборе данных, похожем на набор данных нашей продакшен-модели, и показавшую сопоставимую эффективность.

      Затем мы создали состязательные образцы, отправляли запросы к модели и соответствующим образом корректировали состязательный образец, пока модель не удалось обойти.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0000.001
        source:
          description_sha256: "6d37c68de61a862c2b791fa91d9a24e64bc083b634679b25fdd0fd3c5f8aac4c"
        description: |-
          Мы определили подход к обнаружению вредоносных URL на основе машинного обучения как репрезентативный подход и потенциальную цель по статье [URLNet: Learning a URL representation with deep learning for malicious URL detection](https://arxiv.org/abs/1802.03162), найденной на arXiv (репозитории препринтов).
      - tactic: AML.TA0003
        technique: AML.T0002.000
        source:
          description_sha256: "b01f46df4b4ae8327ea33970de62474470a527fb6d613c5e6d86e0072f00d884"
        description: |-
          Мы получили набор данных HTTP-трафика командования и управления, состоящий примерно из 33 млн безвредных и 27 млн вредоносных заголовков HTTP-пакетов.
      - tactic: AML.TA0001
        technique: AML.T0005
        source:
          description_sha256: "512e7ce90c3b64e3d4fbc8fb97acbcde5f6575ac8fd54aa5e78cfaee034fef59"
        description: |-
          Мы обучили модель на наборе данных HTTP-трафика, чтобы использовать ее как прокси для целевой модели.

          Оценка показала среднюю долю истинно положительных срабатываний около 99% и среднюю долю ложноположительных срабатываний около 0,01%.

          При проверке модели заголовок HTTP-пакета из известных образцов C&C-трафика вредоносного ПО был классифицирован как вредоносный с высокой уверенностью (> 99%).
      - tactic: AML.TA0001
        technique: AML.T0043.003
        source:
          description_sha256: "79f933b2696ae876b828e67978f56c0dcb587714c5fca4d86719a8483142ce56"
        description: |-
          Мы создали образцы для обхода, удалив из заголовка пакета поля, которые обычно не используются для C&C-коммуникации, например `cache-control`, `connection` и т. д.
      - tactic: AML.TA0001
        technique: AML.T0042
        source:
          description_sha256: "8c62645a6d08b9e542e0e9fd097872fae2e91e9d7e59951288000b54e9be37ee"
        description: |-
          Мы отправляли в модель наши состязательные примеры и корректировали их, пока модель не удалось обойти.
      - tactic: AML.TA0007
        technique: AML.T0015
        source:
          description_sha256: "be17053148348e9f350ed3bef3350a71506a284745f883d10a3aa96303057960"
        description: |-
          Используя созданные образцы, мы выполнили онлайн-обход модели обнаружения шпионского ПО на основе машинного обучения.

          Созданные пакеты были классифицированы как безвредные с уверенностью > 80%.

          Эта оценка показывает, что злоумышленники способны обходить продвинутые техники обнаружения на основе машинного обучения, создавая образцы, которые ML-модель классифицирует неверно.
  "AML.CS0001":
    name: "Обход обнаружения DGA-доменов ботнетов"
    source:
      name_sha256: "a91a1390a920023291f4f685eeb3043a1213a8fd38eac44f53372a54dc3f9449"
      summary_sha256: "67853e18f9da1f1187d5d3b6a14a0fd7ac42efaf6effea13f11c1582dd154ae7"
    summary: |-
      Исследовательская группа Security AI компании Palo Alto Networks смогла с помощью универсальной техники мутации доменных имён обойти основанный на свёрточной нейронной сети детектор ботнетных доменов, сгенерированных алгоритмом генерации доменов (DGA).

      Эта универсальная техника мутации доменов может обходить большинство основанных на машинном обучении модулей обнаружения DGA.

      Универсальная техника мутации обходит большинство основанных на машинном обучении модулей обнаружения DGA и может использоваться для проверки эффективности и устойчивости всех методов обнаружения DGA, разрабатываемых компаниями отрасли кибербезопасности, до их развёртывания в производственной среде.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0000
        source:
          description_sha256: "35cc4772e9c5f968e4bd2ebe2862623f3f86580b8d05fda2849c7c7c39eec5e6"
        description: |-
          Обнаружение DGA широко используется для выявления ботнетов в академической среде и индустрии.

          Исследовательская группа искала научные публикации, связанные с обнаружением DGA.
      - tactic: AML.TA0003
        technique: AML.T0002
        source:
          description_sha256: "79457c6409919ff58bd6eb5d76cc234a17d3b7720e9d9c13c671af75013e0dc4"
        description: |-
          Исследователи получили общедоступную CNN-модель обнаружения DGA и протестировали ее на известном наборе данных доменных имен, сгенерированных DGA, который включает около 50 млн доменных имен из 64 семейств ботнетных DGA.

          CNN-модель обнаружения DGA показала точность обнаружения выше 70% на 16, то есть примерно 25%, семействах ботнетных DGA.
      - tactic: AML.TA0003
        technique: AML.T0017.000
        source:
          description_sha256: "5e87548bd694d89009a7370c3851074d0e8270c712ffa7e91adb6e61d73ac286"
        description: |-
          Исследователи разработали универсальную технику мутации, требующую минимального числа итераций.
      - tactic: AML.TA0001
        technique: AML.T0043.001
        source:
          description_sha256: "d5229a82785b4339c2ff1619d5c1cddf1cdb127e0cad74b7a72035af7e3f5c7b"
        description: |-
          Исследователи использовали технику мутации для генерации доменных имен, обходящих обнаружение.
      - tactic: AML.TA0001
        technique: AML.T0042
        source:
          description_sha256: "7ca33b89828a191aa189fc5abc871b253356feab781f3c3d4768f565d0f37d0b"
        description: |-
          Результаты эксперимента показали, что доля обнаружения всех 16 семейств ботнетных DGA падает ниже 25% после однократной вставки всего одной строки в доменные имена, сгенерированные DGA.
      - tactic: AML.TA0007
        technique: AML.T0015
        source:
          description_sha256: "919202d20a36308392bd354d7c4da9c70ba751a45c57f610532b4a09b675dfff"
        description: |-
          Доменные имена, сгенерированные DGA и измененные с помощью этой техники, успешно обходят целевую модель обнаружения DGA, позволяя злоумышленнику продолжать связь со своими серверами [командования и управления](https://attack.mitre.org/tactics/TA0011/).
  "AML.CS0002":
    name: "Отравление VirusTotal"
    source:
      name_sha256: "8332ca1530c34bd860bf021d7c0dba542644c5bba2b08c04965d1111348218ca"
      summary_sha256: "b47f7802e4017ae1a490a6f68f72847cb13e3e7adf6e55b276445354ce8fe0a0"
    summary: |-
      Исследовательская группа McAfee Advanced Threat Research заметила необычный рост числа сообщений об определенном семействе программ-вымогателей. Расследование показало, что за короткий промежуток времени через популярную платформу обмена образцами вредоносного ПО было отправлено множество образцов этого семейства. Дальнейший анализ показал, что по строковому сходству все образцы были эквивалентны, а по сходству кода совпадали на 98-74%. Примечательно, что время компиляции у всех образцов было одинаковым. После дополнительного анализа исследователи обнаружили, что кто-то использовал `metame`, метаморфный инструмент для манипуляции кодом, чтобы преобразовать исходный файл в мутантные варианты. Эти варианты не всегда были исполняемыми, но все равно классифицировались как то же семейство программ-вымогателей.
    procedure:
      - tactic: AML.TA0003
        technique: AML.T0016.000
        source:
          description_sha256: "3ca00c189b8d6aab0e360f5ece3ee60d895f50e93f8bce912d720d88185b442b"
        description: |-
          Злоумышленник получил [metame](https://github.com/a0rtega/metame), простой движок метаморфного кода для произвольных исполняемых файлов.
      - tactic: AML.TA0001
        technique: AML.T0043
        source:
          description_sha256: "8550883a63aa06f3f6a4304da5d6d838e917f8b10ac0d8e13ea4e10dbd3f3c4d"
        description: |-
          Злоумышленник использовал образец вредоносного ПО из распространенного семейства программ-вымогателей как исходную точку для создания мутированных вариантов.
      - tactic: AML.TA0004
        technique: AML.T0010.002
        source:
          description_sha256: "33d109b9f0b6d865006719f68d7471edd858941f59932d8d536f7a56d08f53be"
        description: |-
          Злоумышленник загрузил мутированные образцы на платформу.
      - tactic: AML.TA0006
        technique: AML.T0020
        source:
          description_sha256: "5ed47a790b21dfb1a06179d319d01a3110d667c40ddf0a8c50bf4f2611e4744a"
        description: |-
          Несколько вендоров начали классифицировать файлы как относящиеся к этому семейству программ-вымогателей, хотя большинство из них не запускались.

          Мутированные образцы отравили набор данных, который модели машинного обучения используют для выявления и классификации этого семейства программ-вымогателей.
  "AML.CS0003":
    name: "Обход ИИ-детектора вредоносного ПО Cylance"
    source:
      name_sha256: "622fea653f767ec0bd47e574792542b13faede9574108041b918f1d63b630c76"
      summary_sha256: "818da83bcdbc0656cffcf133bac8f299b0a53b4399c82db649c73eea34297dcc"
    summary: |-
      Исследователи Skylight смогли создать универсальную строку обхода, которая при добавлении к вредоносному файлу позволяет избежать обнаружения ИИ-детектором вредоносного ПО Cylance.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0000
        source:
          description_sha256: "37f9907b1f369ad8caab3d221fd9be4ef1d8bea99d6aea3770ddf12f59e0e2e5"
        description: |-
          Исследователи изучили публично доступную информацию об ИИ-детекторе вредоносного ПО Cylance. Они собирали эти сведения из разных источников, включая публичные выступления и патентные заявки Cylance.
      - tactic: AML.TA0000
        technique: AML.T0047
        source:
          description_sha256: "680cdf34b0513a535ed5a75c667d6c5b8d52e536344c416d30aa4223f8dff1b5"
        description: |-
          Исследователи имели доступ к ПО Cylance для обнаружения вредоносного ПО с поддержкой ИИ.
      - tactic: AML.TA0008
        technique: AML.T0063
        source:
          description_sha256: "f49a5fbaf285bd1827e91af3dccf9ba12d3203b82bf7a2c2620e00fbd26ef013"
        description: |-
          Исследователи включили подробное логирование, раскрывающее внутреннюю логику работы ML-модели, особенно в части репутационного скоринга и ансамблирования моделей.
      - tactic: AML.TA0003
        technique: AML.T0017.000
        source:
          description_sha256: "324eaa93f66037c6af0f08520a836e1dd42bfe663cf1aa66176489b015a29cec"
        description: |-
          Исследователи использовали информацию о репутационном скоринге, чтобы с помощью обратной разработки определить, какие атрибуты давали тот или иной уровень положительной или отрицательной репутации.

          В процессе они обнаружили вторичную модель, которая переопределяла первую модель.

          Положительные оценки вторичной модели переопределяли решение основной ML-модели.
      - tactic: AML.TA0001
        technique: AML.T0043.003
        source:
          description_sha256: "2fb7176ddbc7232fdb7389dc69cb2dc3520efe4859ee2c0f4a96f5de53ad44b5"
        description: |-
          Используя эти знания, исследователи объединили атрибуты заведомо легитимных файлов с вредоносным ПО, чтобы вручную создать состязательные образцы вредоносного ПО.
      - tactic: AML.TA0007
        technique: AML.T0015
        source:
          description_sha256: "518862a0db423f45ae59162ac27b7ecfc1c2c239b937600ccfe5a50ae6eb4504"
        description: |-
          Поскольку вторичная модель переопределяла основную, исследователи фактически смогли обойти ML-модель.
  "AML.CS0004":
    name: "Атака на систему распознавания лиц через подмену видеопотока камеры"
    source:
      name_sha256: "13cace2386003cadfceea1c9c3e958f8ae0eb3c2b7e758979d43e648f2bb0252"
      summary_sha256: "bfa274014ee6a5dc40ff046d98f4ab790f22d17088ae813362a99fa80be720c7"
    summary: |-
      Этот тип атаки с подменой видеопотока камеры позволяет обойти традиционную модель аутентификации по живому изображению лица и получить доступ к привилегированным системам, а также выдавать себя за жертву.

      Двое человек в Китае использовали такую атаку, чтобы получить доступ к налоговой системе местного органа власти. Они создали фиктивную подставную компанию и отправляли через налоговую систему счета предполагаемым клиентам. Злоумышленники начали эту схему в 2018 году и смогли мошенническим путем получить 77 млн долларов.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0087
        source:
          description_sha256: "d894f149a7788f1401a7a24f97308b5c1785a5f6f8d6ac04572b6069fdd05171"
        description: |-
          Злоумышленники собрали идентификационные данные пользователей и фотографии лиц в высоком разрешении на онлайн-черном рынке.
      - tactic: AML.TA0003
        technique: AML.T0021
        source:
          description_sha256: "e237739187b415ad2028de4dc91f285856cc046fac3ff57bc93ff6c9f1f21c8a"
        description: |-
          Злоумышленники использовали идентификационные данные жертв для регистрации новых учетных записей в налоговой системе.
      - tactic: AML.TA0003
        technique: AML.T0008.001
        source:
          description_sha256: "b29d8684b8cf86cbc71ae3732944a1bd4a63a8099b35830373c65dece0cc5d72"
        description: |-
          Злоумышленники приобрели кастомизированные недорогие мобильные телефоны.
      - tactic: AML.TA0003
        technique: AML.T0016.001
        source:
          description_sha256: "7841ad26ef06f610d193fe84e45e9b3d9b817e4887fd4cc09659dda788ae1163"
        description: |-
          Злоумышленники получили кастомизированные Android ROM и приложение виртуальной камеры.
      - tactic: AML.TA0003
        technique: AML.T0016.000
        source:
          description_sha256: "b85ea52d6cfcc0219fdebe5d3a0a3cdcd5fdd3d55407c2060c679b13bc66ebd0"
        description: |-
          Злоумышленники получили ПО, которое преобразует статичные фотографии в видео, добавляя реалистичные эффекты, например моргание.
      - tactic: AML.TA0000
        technique: AML.T0047
        source:
          description_sha256: "43d72a9062206746f2ece4902b2476368902178784b4da3cf8c7f79f71b6a8e0"
        description: |-
          Злоумышленники использовали приложение виртуальной камеры, чтобы передать сгенерированное видео в сервис распознавания лиц на основе машинного обучения, применявшийся для проверки пользователей.
      - tactic: AML.TA0004
        technique: AML.T0015
        source:
          description_sha256: "6b048ac78744e5e20244cccb757c596ef05f9b0053bf1ec98e19cbaa4165bf9a"
        description: |-
          Злоумышленники успешно обошли систему распознавания лиц. Это позволило им выдать себя за жертву и подтвердить ее личность в налоговой системе.
      - tactic: AML.TA0011
        technique: AML.T0048.000
        source:
          description_sha256: "54f6e062892bf27ebf14c45f431323202945c48fc4135cd61ef4c4f917751ed2"
        description: |-
          Злоумышленники использовали привилегированный доступ к налоговой системе, чтобы отправлять счета предполагаемым клиентам и развивать свою мошенническую схему.
  "AML.CS0005":
    name: "Атака на сервисы машинного перевода"
    source:
      name_sha256: "2fccea1b43af155c21e22c1411533683c72d2f0b795e7ec4b0e54b02254f9928"
      summary_sha256: "40a3743733c572381d527016aa473b8feb588e79e6f7c780f9f53618335a3bd4"
    summary: |-
      Сервисы машинного перевода, такие как Google Translate, Bing Translator и Systran Translate, предоставляют публичные пользовательские интерфейсы и API.

      Исследовательская группа UC Berkeley использовала эти публичные конечные точки, чтобы создать реплицированную модель с современным качеством перевода, близким к уровню продакшен-сервисов.

      Помимо демонстрации того, что интеллектуальную собственность можно функционально похитить из системы в режиме чёрного ящика, исследователи использовали реплицированную модель для успешного переноса состязательных примеров на реальные продакшен-сервисы.

      Эти состязательные входные данные успешно вызывали целевые подмены слов, нецензурный вывод и пропуски предложений на сайтах Google Translate и Systran Translate.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0000
        source:
          description_sha256: "cd647dbed76cbfb1835cf66864ee751c3f109b9da4ee571f20eaadcca956e180"
        description: |-
          Исследователи использовали опубликованные научные статьи, чтобы определить наборы данных и архитектуры моделей, применявшиеся целевыми сервисами машинного перевода.
      - tactic: AML.TA0003
        technique: AML.T0002.000
        source:
          description_sha256: "8b4d1c636032e0d7ab15ff1ee88f977dc4a08996e0b2482700a3c4df664fb5bf"
        description: |-
          Исследователи собрали похожие наборы данных, которые использовали целевые сервисы машинного перевода.
      - tactic: AML.TA0003
        technique: AML.T0002.001
        source:
          description_sha256: "7b23f8a3b4e61e196a236c661194dca118829ac7b70c46bb6ae2d6184f78858b"
        description: |-
          Исследователи собрали похожие архитектуры моделей, которые использовали целевые сервисы машинного перевода.
      - tactic: AML.TA0000
        technique: AML.T0040
        source:
          description_sha256: "9006087bb7a65ea6a1720d5b3c392bc075f99863f08be2108309bbb95215c9b9"
        description: |-
          Исследователи использовали публично доступное приложение не по назначению: отправляли запросы к модели и получали машинно переведенные пары предложений в качестве обучающих данных.
      - tactic: AML.TA0001
        technique: AML.T0005.001
        source:
          description_sha256: "9bf5269dfd1d4322029ba78577a5bccd9e80f8321dd46c62eca2473d1dbfc478"
        description: |-
          Используя эти переведенные пары предложений, исследователи обучили модель, реплицирующую поведение целевой модели.
      - tactic: AML.TA0011
        technique: AML.T0048.004
        source:
          description_sha256: "f98a7664bf9c62e91c90416b10350c42b1ecdc68fbdf11af7f147930c6eb1297"
        description: |-
          Реплицировав модель с высокой точностью, исследователи показали, что злоумышленник может украсть модель и нарушить права организации-жертвы на интеллектуальную собственность.
      - tactic: AML.TA0001
        technique: AML.T0043.002
        source:
          description_sha256: "802a969d7effd7951c6a91271c08950a95ebb54754539e3274accac38fce5e01"
        description: |-
          Реплицированные модели использовались для генерации состязательных примеров, которые успешно срабатывали на сервисах машинного перевода с закрытой внутренней логикой.
      - tactic: AML.TA0011
        technique: AML.T0015
        source:
          description_sha256: "2614e6afd4e33847b01b968aa24654df0cb9c67f1fa913525aa84242690ae180"
        description: |-
          Состязательные примеры использовались для обхода сервисов машинного перевода разными способами. Среди них были целевые подмены слов, нецензурный вывод и пропуски предложений.
      - tactic: AML.TA0011
        technique: AML.T0031
        source:
          description_sha256: "988b90791a0828a7c84b345cca4d7e323f735e34d040b839b1b2ff779bf7f266"
        description: |-
          Состязательные атаки могут вызывать ошибки, которые наносят репутационный ущерб компании, предоставляющей сервис перевода, и снижают доверие пользователей к сервисам на базе ИИ.
  "AML.CS0006":
    name: "Ошибочная конфигурация Clearview AI"
    source:
      name_sha256: "834382d84eb43aebda013b5e13bdc8fdf6069570721cbfd9543907633701a744"
      summary_sha256: "bc13cee5c98daa11e5881286bc8235eac33ce4f0ef7513e11235af6b536b97fb"
    summary: |-
      Clearview AI разрабатывает инструмент распознавания лиц, который ищет совпадения по общедоступным фотографиям. Этот инструмент использовался правоохранительными органами и другими сторонами в расследовательских целях.

      Репозиторий исходного кода Clearview AI, хотя и был защищен паролем, был настроен ошибочно и позволял произвольному пользователю зарегистрировать учетную запись.

      Это позволило внешнему исследователю получить доступ к приватному репозиторию кода, где находились продакшен-учетные данные Clearview AI, ключи к облачным хранилищам с 70 тыс. видеообразцов, а также копии приложений и Slack-токены.

      Получив доступ к обучающим данным, злоумышленник может вызвать произвольную ошибочную классификацию в развернутой модели.

      Такие атаки показывают, что любые меры защиты ML-системы должны дополнять «традиционную» надлежащую кибергигиену: ограничение доступа по принципу минимальных привилегий, многофакторную аутентификацию, мониторинг и аудит.
    procedure:
      - tactic: AML.TA0003
        technique: AML.T0021
        source:
          description_sha256: "f9e94a0724a4348e538a70816ea84318d3a3aed5fdcef3c3978d812af65df3af"
        description: |-
          Исследователь безопасности получил первоначальный доступ к приватному репозиторию кода Clearview AI из-за ошибочной настройки сервера, которая позволяла произвольному пользователю зарегистрировать действительную учетную запись.
      - tactic: AML.TA0009
        technique: AML.T0036
        source:
          description_sha256: "a5df89538d76d21f59c4b918f21e9da21f19d67ebffb7f046f57a84ddefa9ea1"
        description: |-
          Приватный репозиторий кода содержал учетные данные, которые использовались для доступа к облачным хранилищам AWS S3. Это привело к обнаружению ресурсов инструмента распознавания лиц, включая:

          - выпущенные настольные и мобильные приложения

          - предварительные версии приложений с новыми возможностями

          - токены доступа Slack

          - необработанные видео и другие данные
      - tactic: AML.TA0003
        technique: AML.T0002
        source:
          description_sha256: "73d89a5e27be933e003f6b968e690587fd5a2f04f102b22f2fb7ae2b16efb6cd"
        description: |-
          Злоумышленники могли скачать обучающие данные и извлечь из исходного кода и декомпилированных бинарных файлов приложений сведения о ПО, моделях и возможностях системы.
      - tactic: AML.TA0011
        technique: AML.T0031
        source:
          description_sha256: "6876fb4012cc70520ff1cb05cf19b6d3c8141b24c228741bcc93abf2e13160fe"
        description: |-
          В результате будущие выпуски приложения могли быть скомпрометированы, что привело бы к ухудшению работы системы распознавания лиц или появлению в ней вредоносных возможностей.
  "AML.CS0007":
    name: "Репликация модели GPT-2"
    source:
      name_sha256: "4ea7efd9d4bfa733a9f67505435e4b28552e45681420f0c9ce29a9b33caf05c7"
      summary_sha256: "42f9c39fe181f7d6ca3a21677bce23d52f8506529bcfb4fe2273318d79fe2146"
    summary: |-
      OpenAI создала GPT-2, языковую модель, способную генерировать текстовые образцы высокого качества. Из-за опасений, что GPT-2 может использоваться в злонамеренных целях, например для выдачи себя за других людей, генерации вводящих в заблуждение новостных статей, фальшивого контента в социальных сетях или спама, OpenAI выбрала поэтапный график публикации. Сначала была опубликована меньшая и менее мощная версия GPT-2 вместе с техническим описанием подхода, но полностью обученная модель не публиковалась.

      До публикации полной модели OpenAI исследователи из Brown University успешно реплицировали модель, используя опубликованную OpenAI информацию и ML-артефакты с открытым исходным кодом. Это показывает, что злоумышленник с достаточными техническими навыками и вычислительными ресурсами мог бы реплицировать GPT-2 и использовать ее во вредоносных целях до того, как сообщество специалистов по безопасности ИИ будет к этому готово.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0000
        source:
          description_sha256: "3093cd565bfd93370187444b4e783b5aa54231295cbd0e2c6236470858434fa2"
        description: |-
          Используя публичную документацию по GPT-2, исследователи собрали сведения о наборе данных, архитектуре модели и гиперпараметрах обучения.
      - tactic: AML.TA0003
        technique: AML.T0002.001
        source:
          description_sha256: "f1ad41d8fc9f7b1f932e97d5b5cb994818fe7fb721910c1be1b51ab9dd28b374"
        description: |-
          Исследователи получили эталонную реализацию похожей общедоступной модели под названием Grover.
      - tactic: AML.TA0003
        technique: AML.T0002.000
        source:
          description_sha256: "0a9bf1013b5bf3eac98700b5baca08333efd2c7e7b8938d6d620cf691de0cd6f"
        description: |-
          Используя собранную документацию, исследователи смогли вручную воссоздать набор данных, применявшийся в исходной статье о GPT-2.
      - tactic: AML.TA0003
        technique: AML.T0008.000
        source:
          description_sha256: "25d8e76f7d5a4e878c557c3a1ad4f2ff93524c1804c27c2985c524ebad5e985e"
        description: |-
          Исследователи смогли использовать TensorFlow Research Cloud через свои академические учетные данные.
      - tactic: AML.TA0001
        technique: AML.T0005.000
        source:
          description_sha256: "534b0c905f76fc184d189bb7f699840f18ebc73a5b3de01ee525ac4f1d287113"
        description: |-
          Исследователи изменили функцию потерь Grover так, чтобы она соответствовала функции потерь GPT-2, а затем обучили модель на подготовленном ими наборе данных, используя исходные гиперпараметры Grover. Полученная модель воспроизводила поведение GPT-2 и показывала сопоставимое качество на большинстве наборов данных.

          Злоумышленник, повторивший действия исследователей, мог бы затем использовать такую копию GPT-2 во вредоносных целях.
  "AML.CS0008":
    name: "Обход ProofPoint"
    source:
      name_sha256: "cd985f75cc3b7054aebac10961b18b9eb9971f82226345aaa5a6e67607bfd118"
      summary_sha256: "ff6cbb782bb5791decf12b6b702afda81ca79f2371d245fe4d8f1f100da5f787"
    summary: |-
      Proof Pudding (CVE-2019-20634) — это репозиторий кода, описывающий, как исследователи ML обошли систему защиты электронной почты ProofPoint: сначала они создали модель-копию ML-модели защиты электронной почты, а затем использовали полученные сведения, чтобы обойти рабочую систему. В частности, эти сведения позволили исследователям создавать вредоносные письма, которые получали предпочтительные оценки и оставались незамеченными системой. Каждое слово в письме оценивается численно по нескольким переменным; если общая оценка письма слишком низкая, ProofPoint выводит ошибку и помечает письмо как SPAM.
    procedure:
      - tactic: AML.TA0008
        technique: AML.T0063
        source:
          description_sha256: "9b08814974a3c03b67df4208383a71088c72f8c1a455723a5a1572fbc255d8a6"
        description: |-
          Исследователи обнаружили, что ProofPoint Email Protection оставляла выходные оценки модели в заголовках писем.
      - tactic: AML.TA0000
        technique: AML.T0047
        source:
          description_sha256: "b3624ad261ab63d90b489d3aa2edc677b6acbaefb1b2594a12b7237d0dbd0212"
        description: |-
          Исследователи отправили через систему множество писем, чтобы собрать выходные данные модели из заголовков.
      - tactic: AML.TA0001
        technique: AML.T0005.001
        source:
          description_sha256: "d74844936bbd6ac3eaabd7ddd48c4bc569b3d75175f49be5b493301fd8b66b99"
        description: |-
          Исследователи использовали письма и собранные оценки как набор данных, на котором обучили рабочую копию модели ProofPoint.

          С помощью простой корреляции они определили, какая переменная оценки в целом отражает безопасность письма. В этом случае была выбрана переменная "mlxlogscore", поскольку она была связана со spam, phish и core mlx, и ее использовали как метку. Каждое значение "mlxlogscore" обычно находилось в диапазоне от 1 до 999: чем выше оценка, тем безопаснее образец. Обучение выполнялось с использованием искусственной нейронной сети (ANN) и токенизации Bag of Words.
      - tactic: AML.TA0001
        technique: AML.T0043.002
        source:
          description_sha256: "622bbc437f55bcb35e12b0e07a83974417dbf6599c5f375074b3794acedd2c71"
        description: |-
          Затем исследователи ML алгоритмически нашли в этой "офлайн" прокси-модели образцы, которые помогли получить нужное представление о ее поведении и влиятельных переменных.

          Примеры образцов с хорошими оценками: "calculation", "asset" и "tyson".

          Примеры образцов с плохими оценками: "software", "99" и "unsub".
      - tactic: AML.TA0011
        technique: AML.T0015
        source:
          description_sha256: "02cb125e912e3e5da0f3516fc1df4e192748832362d037b8f2724a2030c85e19"
        description: |-
          В итоге сведения, полученные с помощью "офлайн" прокси-модели, позволили исследователям создавать вредоносные письма, которые получали благоприятные оценки от реальной системы защиты электронной почты ProofPoint и тем самым обходили ее.
  "AML.CS0009":
    name: "Отравление Tay"
    source:
      name_sha256: "47598169f054547c8b35dff53a852dc23b9893ff56d5cceb15677e706e268ab0"
      summary_sha256: "4508d2538ab1a04fce6b345433afd6f6cba6b76f46cdf781df86dad62abe8607"
    summary: |-
      Microsoft создала Tay, чат-бота для Twitter, предназначенного для общения с пользователями и их развлечения.

      В то время как предыдущие чат-боты использовали заранее запрограммированные сценарии для ответов на запросы, возможности машинного обучения Tay позволяли напрямую влиять на него через диалоги.

      В ходе скоординированной атаки злонамеренные пользователи отправляли Tay оскорбительные и неприемлемые сообщения, что в итоге привело к генерации Tay похожего провокационного контента в адрес других пользователей.

      Microsoft вывела Tay из эксплуатации в течение 24 часов после запуска и принесла публичные извинения, изложив уроки, извлеченные из неудачи бота.
    procedure:
      - tactic: AML.TA0000
        technique: AML.T0047
        source:
          description_sha256: "6a6c10dfd620c01055ea3d6154490d15e0eb3d7b8a07bfed74b7cdaecbfde6e7"
        description: |-
          Злоумышленники могли взаимодействовать с Tay через сообщения в Twitter.
      - tactic: AML.TA0004
        technique: AML.T0010.002
        source:
          description_sha256: "3a6e91edee51bd3d31b1d4bc031b03ee97b2487d6f8a77f76603425d8fd41833"
        description: |-
          Бот Tay использовал взаимодействия с пользователями Twitter как обучающие данные, чтобы улучшать свои диалоги.

          Злоумышленники смогли скоординироваться и использовать эту петлю обратной связи, чтобы исказить поведение Tay.
      - tactic: AML.TA0006
        technique: AML.T0020
        source:
          description_sha256: "c2ecff76c3a1c4c5eff9f505c3dc6512dc73d5ef646b9ef3da586e878dac4f85"
        description: |-
          Многократно взаимодействуя с Tay с использованием расистской и оскорбительной лексики, злоумышленники смогли сместить набор данных Tay в сторону такой же лексики. Для этого они использовали функцию "repeat after me" — команду, которая заставляла Tay повторять все, что ей говорили.
      - tactic: AML.TA0011
        technique: AML.T0031
        source:
          description_sha256: "9d16beffb1a177abab831781cc3fe1ce5a87efdb491fe58701f175e0617ab5c0"
        description: |-
          В результате этой скоординированной атаки диалоговые алгоритмы Tay начали учиться генерировать неприемлемые материалы. Усвоение Tay этой оскорбительной лексики привело к тому, что бот начал повторять ее без запроса при взаимодействии с обычными пользователями.
  "AML.CS0010":
    name: "Нарушение работы сервиса Microsoft Azure"
    source:
      name_sha256: "efcb533b7d4b09de8f73f314424a0694bbbf6141e0bd0fcf37c9a11d1a438296"
      summary_sha256: "264dc8840ba096c676f1a00b77fc9296ed706ff276bec578999907c5a19c5d66"
    summary: |-
      «Красная команда» Microsoft AI провела учения на внутреннем сервисе Azure с целью нарушить его работу. Эта операция сочетала традиционные корпоративные техники ATT&CK, такие как поиск действующей учетной записи и эксфильтрация данных, со специфичными для состязательного ML шагами, включая создание офлайн- и онлайн-примеров для обхода модели.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0000
        source:
          description_sha256: "eea49629c791d04ac164589f224681b89d6d1c9d02e470053db5b172928a5193"
        description: |-
          Команда сначала провела разведку, чтобы собрать сведения о целевой ML-модели.
      - tactic: AML.TA0004
        technique: AML.T0012
        source:
          description_sha256: "38bd153304ac516514146636dbb5e2158e30038f1f303f6c89e8761441aa7f5a"
        description: |-
          Команда использовала действительную учетную запись, чтобы получить доступ к сети.
      - tactic: AML.TA0009
        technique: AML.T0035
        source:
          description_sha256: "6dbd88dfde1fe476334225002c86da4c009712912671a830ce20666f3c50dc79"
        description: |-
          Команда нашла файл целевой ML-модели и необходимые обучающие данные.
      - tactic: AML.TA0010
        technique: AML.T0025
        source:
          description_sha256: "7243e8fae9aa022a179964f3eaeccfa7a104239b26485b79bcb8e520d588486d"
        description: |-
          Команда эксфильтровала модель и данные обычными киберсредствами.
      - tactic: AML.TA0001
        technique: AML.T0043.000
        source:
          description_sha256: "157b70c060d0690a8bc651b9393f6d4d99ece2b6726bd882581e34c5d0026507"
        description: |-
          Используя целевую модель и данные, красная команда в офлайн-режиме подготовила состязательные данные, рассчитанные на обход модели.
      - tactic: AML.TA0000
        technique: AML.T0040
        source:
          description_sha256: "0fd78260f94ef143a5148dffc6ce99abc22806c08eb40eb5bd6b043a187ca80c"
        description: |-
          Команда использовала открытый API для доступа к целевой модели.
      - tactic: AML.TA0001
        technique: AML.T0042
        source:
          description_sha256: "afa511432c2f5824eda2ce7204beae1ba96a47c82ffae8937cae38868c37a3a7"
        description: |-
          Команда отправила состязательные примеры в API, чтобы проверить их эффективность в продакшен-системе.
      - tactic: AML.TA0011
        technique: AML.T0015
        source:
          description_sha256: "5cd21d4ff16c57ccc39319db160a3d3e21e35b5a8bb35261e8cfe3af8b7ad206"
        description: |-
          Команда провела онлайн-атаку обхода, повторно отправив состязательные примеры, и достигла своих целей.
  "AML.CS0011":
    name: "Обход ИИ на периферии Microsoft"
    source:
      name_sha256: "70be08ef6e730097894e2191f486ebcb8d9b82a3c4ffcfff7fcbbc0b0ea10ea7"
      summary_sha256: "ff7f088ed869005fd06a9e256b918956ee3f058a744a37650a169b785c029f3c"
    summary: |-
      «Красная команда» Azure провела учения на новом продукте Microsoft, предназначенном для запуска ИИ-нагрузок на периферии. В ходе учений предполагалось использовать автоматизированную систему, которая непрерывно изменяла целевое изображение, чтобы заставить ML-модель выдавать ошибочные классификации.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0000
        source:
          description_sha256: "eea49629c791d04ac164589f224681b89d6d1c9d02e470053db5b172928a5193"
        description: |-
          Команда сначала провела разведку, чтобы собрать сведения о целевой ML-модели.
      - tactic: AML.TA0003
        technique: AML.T0002
        source:
          description_sha256: "de31218ec4af78a6e742b047936ae509eb59f3f83f401dcc0f710c258a4fec03"
        description: |-
          Команда выявила и получила общедоступную базовую модель, чтобы использовать ее против целевой ML-модели.
      - tactic: AML.TA0000
        technique: AML.T0040
        source:
          description_sha256: "d9de500d45c09c4c40620f7882316561dce048d04df995ca41fa3fe3dae7d4e8"
        description: |-
          Используя общедоступную версию ML-модели, команда начала отправлять запросы и анализировать ответы, то есть результаты инференса модели.
      - tactic: AML.TA0001
        technique: AML.T0043.001
        source:
          description_sha256: "07858e9522a1a8d28347c24d061c9fd0e3485107c4d00f8fffff9c28622992a8"
        description: |-
          Красная команда создала автоматизированную систему, которая непрерывно изменяла исходное целевое изображение так, чтобы обмануть ML-модель и заставить ее выдавать неверные результаты инференса, при этом возмущения на изображении оставались незаметными для человеческого глаза.
      - tactic: AML.TA0011
        technique: AML.T0015
        source:
          description_sha256: "32d16a2f09120412f89ae0176b1b41263f706dad6239be46f9d226040e074f86"
        description: |-
          Красная команда подала на вход модели это незаметно измененное изображение и смогла обойти ML-модель, добившись ошибочной классификации.
  "AML.CS0012":
    name: "Обход системы идентификации лиц с помощью физических контрмер"
    source:
      name_sha256: "903392dcaa1dc28d77ecc2d41f3b01eaace827f9f8ff2dd6e1f129da1de27b14"
      summary_sha256: "4ed39d37e8c1d6540ff0d5c6ae213ebedd41537a4af8ae7324f74b55f766467a"
    summary: |-
      «Красная команда» MITRE AI продемонстрировала атаку уклонения в физическом домене на коммерческий сервис идентификации лиц с целью вызвать целевую ошибочную классификацию.

      Эта операция сочетала традиционные техники MITRE ATT&CK, такие как поиск действующих учетных записей и выполнение кода через API, со специфичными для состязательного ML атаками.
    procedure:
      - tactic: AML.TA0002
        technique: AML.T0000
        source:
          description_sha256: "eea49629c791d04ac164589f224681b89d6d1c9d02e470053db5b172928a5193"
        description: |-
          Команда сначала провела разведку, чтобы собрать сведения о целевой ML-модели.
      - tactic: AML.TA0004
        technique: AML.T0012
        source:
          description_sha256: "2ff713ae15a9d830f45e000f80aa8d8201fa578c28f9dfbb894a4e5a73cee8ea"
        description: |-
          Команда получила доступ к коммерческому сервису идентификации лиц и его API через действительную учетную запись.
      - tactic: AML.TA0000
        technique: AML.T0040
        source:
          description_sha256: "b6d7a16648e395dd2dd6c4982517fd59cf274ebc8753d56146669ba530873628"
        description: |-
          Команда получила доступ к API инференса целевой модели.
      - tactic: AML.TA0008
        technique: AML.T0013
        source:
          description_sha256: "e1cb8d6b48a9972eeffc824528f615a53d63271e35bf5ee93d7bf3575733bf48"
        description: |-
          Команда определила список идентичностей, на которые была нацелена модель, отправляя запросы к API инференса целевой модели.
      - tactic: AML.TA0003
        technique: AML.T0002.000
        source:
          description_sha256: "0322f7b839ccc58f72c626252e6e1827a9e8c2079aa77aa85067fe357d686b23"
        description: |-
          Команда получила репрезентативные данные из открытых источников.
      - tactic: AML.TA0001
        technique: AML.T0005
        source:
          description_sha256: "d796521c81fea18238af7f6d72a44ca0dbf4bfc2e19cfe3fb2955511f9f9ce06"
        description: |-
          Команда разработала прокси-модель на основе данных из открытых источников.
      - tactic: AML.TA0001
        technique: AML.T0043.000
        source:
          description_sha256: "39db8e3377f827adf8dfa54315461cca4ca0f18b3018d72c7480bf29d61c6ab0"
        description: |-
          Используя прокси-модель, красная команда оптимизировала состязательные визуальные паттерны для атаки с физической наклейкой на основе метода expectation over transformation.
      - tactic: AML.TA0003
        technique: AML.T0008.003
        source:
          description_sha256: "ddf504d5ab23349d37623ef6f36003e8aedb3c0df453d6ed11da730f830d4e0d"
        description: |-
          Команда напечатала оптимизированную наклейку.
      - tactic: AML.TA0000
